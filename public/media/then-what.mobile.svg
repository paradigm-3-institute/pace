<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1618" viewBox="0 0 480 1618" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Effects of a pacing intervention, outward through society</title>
  <desc id="dsc">Six stages, outward through society and forward in time: the rule as written; covered developers re-optimising; relative power shifting as others read the pace; governance machinery that may outlast the rule; investment and markets repricing on expectation; and norms and culture that set the terms for the next intervention.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }
    </style>
  </defs>
  <rect width="480" height="1618" fill="#f3f6f9"/>
  <rect width="480" height="1618" fill="url(#grid)"/>
  <rect class="band" x="52" y="20" width="400" height="34" />
  <text class="ph" x="252.0" y="37" text-anchor="middle" dominant-baseline="central" >OUTWARDS THROUGH SOCIETY</text>
  <rect class="box" x="52" y="74" width="400" height="148" />
  <rect class="" x="52" y="170" width="400" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="74" width="400" height="148" />
  <line class="sep" x1="52" y1="110" x2="452" y2="110"/>
  <text class="hd" x="252.0" y="92" text-anchor="middle" dominant-baseline="central" >THE RULE</text>
  <text class="b2" x="252.0" y="131.0" text-anchor="middle" dominant-baseline="central" >A pacing intervention as written: scope,</text>
  <text class="b2" x="252.0" y="150.0" text-anchor="middle" dominant-baseline="central" >trigger, control surface, exit.</text>
  <text class="lb" x="252.0" y="182" text-anchor="middle" dominant-baseline="central" font-size="7px">CHANGES</text>
  <text class="ef" x="252.0" y="202.0" text-anchor="middle" dominant-baseline="central" >CONSTRAINTS, NOT OBJECTIVES</text>
  <rect class="band" x="52" y="230" width="400" height="34" />
  <text class="ph" x="252.0" y="247.0" text-anchor="middle" dominant-baseline="central" >WHEN IT LANDS</text>
  <line class="arr" x1="252.0" y1="264" x2="252.0" y2="296"/>
  <polygon class="head" points="244.0,294 260.0,294 252.0,308"/>
  <rect class="box" x="52" y="308" width="400" height="186" />
  <rect class="" x="52" y="442" width="400" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="308" width="400" height="186" />
  <line class="sep" x1="52" y1="344" x2="452" y2="344"/>
  <text class="hd" x="252.0" y="326" text-anchor="middle" dominant-baseline="central" >COVERED DEVELOPERS</text>
  <text class="b2" x="252.0" y="365.0" text-anchor="middle" dominant-baseline="central" >New constraints, unchanged objectives:</text>
  <text class="b2" x="252.0" y="384.0" text-anchor="middle" dominant-baseline="central" >developers re-optimise, adapting within the</text>
  <text class="b2" x="252.0" y="403.0" text-anchor="middle" dominant-baseline="central" >rule, working around it, or working on the</text>
  <text class="b2" x="252.0" y="422.0" text-anchor="middle" dominant-baseline="central" >rule itself.</text>
  <text class="lb" x="252.0" y="454" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.1</text>
  <text class="ef" x="252.0" y="466.5" text-anchor="middle" dominant-baseline="central" >THE RULE IN PRACTICE =</text>
  <text class="ef" x="252.0" y="481.5" text-anchor="middle" dominant-baseline="central" >RULE + BEST RESPONSE</text>
  <rect class="band" x="52" y="502" width="400" height="34" />
  <text class="ph" x="252.0" y="519.0" text-anchor="middle" dominant-baseline="central" >ON ENACTMENT</text>
  <line class="arr" x1="252.0" y1="536" x2="252.0" y2="568"/>
  <polygon class="head" points="244.0,566 260.0,566 252.0,580"/>
  <rect class="box" x="52" y="580" width="400" height="167" />
  <rect class="" x="52" y="695" width="400" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="580" width="400" height="167" />
  <line class="sep" x1="52" y1="616" x2="452" y2="616"/>
  <text class="hd" x="252.0" y="598" text-anchor="middle" dominant-baseline="central" >RELATIVE POWER</text>
  <text class="b2" x="252.0" y="637.0" text-anchor="middle" dominant-baseline="central" >Governments, non-covered developers and</text>
  <text class="b2" x="252.0" y="656.0" text-anchor="middle" dominant-baseline="central" >adversaries read the pace as opportunity or</text>
  <text class="b2" x="252.0" y="675.0" text-anchor="middle" dominant-baseline="central" >obstacle, and exploit, absorb or evade it.</text>
  <text class="lb" x="252.0" y="707" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.2</text>
  <text class="ef" x="252.0" y="719.5" text-anchor="middle" dominant-baseline="central" >FRONTIER COMMODITISES;</text>
  <text class="ef" x="252.0" y="734.5" text-anchor="middle" dominant-baseline="central" >MORE ACTORS TO MONITOR</text>
  <rect class="band" x="52" y="755" width="400" height="34" />
  <text class="ph" x="252.0" y="772.0" text-anchor="middle" dominant-baseline="central" >FROM ENACTMENT ONWARDS</text>
  <line class="arr" x1="252.0" y1="789" x2="252.0" y2="821"/>
  <polygon class="head" points="244.0,819 260.0,819 252.0,833"/>
  <rect class="box" x="52" y="833" width="400" height="186" />
  <rect class="" x="52" y="967" width="400" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="833" width="400" height="186" />
  <line class="sep" x1="52" y1="869" x2="452" y2="869"/>
  <text class="hd" x="252.0" y="851" text-anchor="middle" dominant-baseline="central" >GOVERNANCE MACHINERY</text>
  <text class="b2" x="252.0" y="890.0" text-anchor="middle" dominant-baseline="central" >The main effect is to make it exist: new</text>
  <text class="b2" x="252.0" y="909.0" text-anchor="middle" dominant-baseline="central" >powers to inspect and enforce, which become</text>
  <text class="b2" x="252.0" y="928.0" text-anchor="middle" dominant-baseline="central" >a target for capture and a source of</text>
  <text class="b2" x="252.0" y="947.0" text-anchor="middle" dominant-baseline="central" >distortion.</text>
  <text class="lb" x="252.0" y="979" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.3</text>
  <text class="ef" x="252.0" y="991.5" text-anchor="middle" dominant-baseline="central" >MAY OUTLAST THE RULE</text>
  <text class="ef" x="252.0" y="1006.5" text-anchor="middle" dominant-baseline="central" >THAT JUSTIFIED IT</text>
  <rect class="band" x="52" y="1027" width="400" height="34" />
  <text class="ph" x="252.0" y="1044.0" text-anchor="middle" dominant-baseline="central" >AT ACTIVATION; MAY PERSIST PAST EXIT</text>
  <line class="arr" x1="252.0" y1="1061" x2="252.0" y2="1093"/>
  <polygon class="head" points="244.0,1091 260.0,1091 252.0,1105"/>
  <rect class="box" x="52" y="1105" width="400" height="186" />
  <rect class="" x="52" y="1239" width="400" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="1105" width="400" height="186" />
  <line class="sep" x1="52" y1="1141" x2="452" y2="1141"/>
  <text class="hd" x="252.0" y="1123" text-anchor="middle" dominant-baseline="central" >INVESTMENT &amp; MARKETS</text>
  <text class="b2" x="252.0" y="1162.0" text-anchor="middle" dominant-baseline="central" >Valuations reprice on the expected</text>
  <text class="b2" x="252.0" y="1181.0" text-anchor="middle" dominant-baseline="central" >trajectory, long before any capability</text>
  <text class="b2" x="252.0" y="1200.0" text-anchor="middle" dominant-baseline="central" >effect; leveraged builds strand and the</text>
  <text class="b2" x="252.0" y="1219.0" text-anchor="middle" dominant-baseline="central" >restrained seek compensation.</text>
  <text class="lb" x="252.0" y="1251" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.4</text>
  <text class="ef" x="252.0" y="1271.0" text-anchor="middle" dominant-baseline="central" >LIKELY THE MOST IMMEDIATE EFFECT</text>
  <rect class="band" x="52" y="1299" width="400" height="34" />
  <text class="ph" x="252.0" y="1316.0" text-anchor="middle" dominant-baseline="central" >ON EXPECTATION, BEFORE ANY DIRECT EFFECT</text>
  <line class="arr" x1="252.0" y1="1333" x2="252.0" y2="1365"/>
  <polygon class="head" points="244.0,1363 260.0,1363 252.0,1377"/>
  <rect class="box" x="52" y="1377" width="400" height="167" />
  <rect class="" x="52" y="1492" width="400" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="1377" width="400" height="167" />
  <line class="sep" x1="52" y1="1413" x2="452" y2="1413"/>
  <text class="hd" x="252.0" y="1395" text-anchor="middle" dominant-baseline="central" >NORMS &amp; CULTURE</text>
  <text class="b2" x="252.0" y="1434.0" text-anchor="middle" dominant-baseline="central" >Frontier prestige falls and talent</text>
  <text class="b2" x="252.0" y="1453.0" text-anchor="middle" dominant-baseline="central" >self-selects; credit for prevention is</text>
  <text class="b2" x="252.0" y="1472.0" text-anchor="middle" dominant-baseline="central" >invisible while blame for harm is not.</text>
  <text class="lb" x="252.0" y="1504" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.5</text>
  <text class="ef" x="252.0" y="1516.5" text-anchor="middle" dominant-baseline="central" >SETS THE TERMS FOR</text>
  <text class="ef" x="252.0" y="1531.5" text-anchor="middle" dominant-baseline="central" >THE NEXT INTERVENTION</text>
  <rect class="band" x="52" y="1552" width="400" height="46" />
  <text class="ph" x="252.0" y="1569.0" text-anchor="middle" dominant-baseline="central" >AFTERWARDS; SHAPES THE</text>
  <text class="ph" x="252.0" y="1581.0" text-anchor="middle" dominant-baseline="central" >NEXT INTERVENTION</text>
  <line class="arr" x1="30" y1="70" x2="30" y2="1582"/>
  <polygon class="head" points="22,1580 38,1580 30,1594"/>

</svg>
