<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="430" viewBox="0 0 1360 430" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Effect of blocking a targeted step</title>
  <desc id="dsc">Before intervention, pathway A runs through a targeted step and a route-specific effect to a capability, and pathway B reaches the same capability through an alternate route. After blocking the targeted step, that route is blocked but the alternate route still works: blocking one step can remove one route without removing the capability.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }
    </style>
  </defs>
  <rect width="1360" height="430" fill="#f3f6f9"/>
  <rect width="1360" height="430" fill="url(#grid)"/>
  <rect class="box" x="30" y="25" width="640" height="380" />
  <line class="sep" x1="30" y1="65" x2="670" y2="65"/>
  <text class="hd" x="350.0" y="45" text-anchor="middle" dominant-baseline="central" >BEFORE INTERVENTION</text>
  <rect class="box" x="60" y="105" width="136" height="56" />
  <text class="hs" x="128.0" y="133.0" text-anchor="middle" dominant-baseline="central" >pathway A</text>
  <rect class="box" x="60" y="225" width="136" height="56" />
  <text class="hs" x="128.0" y="253.0" text-anchor="middle" dominant-baseline="central" >pathway B</text>
  <rect class="box" x="235" y="225" width="136" height="56" />
  <text class="hs" x="303.0" y="253.0" text-anchor="middle" dominant-baseline="central" >alternate route</text>
  <rect class="box" x="522.0" y="165.0" width="136" height="56" />
  <text class="hs" x="590" y="193" text-anchor="middle" dominant-baseline="central" >capability</text>
  <line class="arr" x1="196" y1="133.0" x2="223" y2="133.0"/>
  <polygon class="head" points="221,125.0 221,141.0 235,133.0"/>
  <line class="arr" x1="196" y1="253.0" x2="223" y2="253.0"/>
  <polygon class="head" points="221,245.0 221,261.0 235,253.0"/>
  <path class="arr" d="M371 253.0 H590 V233.0"/>
  <polygon class="head" points="582,235.0 598,235.0 590,221.0"/>
  <rect class="red" x="235" y="105" width="136" height="56" />
  <text class="redt" x="303.0" y="133.0" text-anchor="middle" dominant-baseline="central" >targeted step</text>
  <rect class="box" x="410" y="105" width="136" height="56" />
  <text class="hs" x="478.0" y="125.5" text-anchor="middle" dominant-baseline="central" >route-specific</text>
  <text class="hs" x="478.0" y="140.5" text-anchor="middle" dominant-baseline="central" >effect</text>
  <line class="arr" x1="371" y1="133.0" x2="398" y2="133.0"/>
  <polygon class="head" points="396,125.0 396,141.0 410,133.0"/>
  <path class="arr" d="M546 133.0 H590 V153.0"/>
  <polygon class="head" points="582,151.0 598,151.0 590,165.0"/>
  <text class="cap" x="350.0" y="370" text-anchor="middle" dominant-baseline="central" >Two different pathways can lead to the same capability.</text>
  <rect class="box" x="690" y="25" width="640" height="380" />
  <line class="sep" x1="690" y1="65" x2="1330" y2="65"/>
  <text class="hd" x="1010.0" y="45" text-anchor="middle" dominant-baseline="central" >AFTER BLOCKING THE TARGETED STEP</text>
  <rect class="box" x="720" y="105" width="136" height="56" />
  <text class="hs" x="788.0" y="133.0" text-anchor="middle" dominant-baseline="central" >pathway A</text>
  <rect class="box" x="720" y="225" width="136" height="56" />
  <text class="hs" x="788.0" y="253.0" text-anchor="middle" dominant-baseline="central" >pathway B</text>
  <rect class="box" x="895" y="225" width="136" height="56" />
  <text class="hs" x="963.0" y="253.0" text-anchor="middle" dominant-baseline="central" >alternate route</text>
  <rect class="box" x="1182.0" y="165.0" width="136" height="56" />
  <text class="hs" x="1250" y="193" text-anchor="middle" dominant-baseline="central" >capability</text>
  <line class="arr" x1="856" y1="133.0" x2="883" y2="133.0"/>
  <polygon class="head" points="881,125.0 881,141.0 895,133.0"/>
  <line class="arr" x1="856" y1="253.0" x2="883" y2="253.0"/>
  <polygon class="head" points="881,245.0 881,261.0 895,253.0"/>
  <path class="arr" d="M1031 253.0 H1250 V233.0"/>
  <polygon class="head" points="1242,235.0 1258,235.0 1250,221.0"/>
  <rect class="ghost" x="895" y="105" width="136" height="56" />
  <line class="cross" x1="895" y1="105" x2="1031" y2="161"/>
  <line class="cross" x1="1031" y1="105" x2="895" y2="161"/>
  <rect class="red" x="895" y="105" width="136" height="56" fill="none" stroke-dasharray="5 4"/>
  <text class="redt" x="963.0" y="133.0" text-anchor="middle" dominant-baseline="central" >targeted step</text>
  <rect class="ghost" x="1070" y="105" width="136" height="56" />
  <line class="cross" x1="1070" y1="105" x2="1206" y2="161"/>
  <line class="cross" x1="1206" y1="105" x2="1070" y2="161"/>
  <text class="ghostt" x="1138.0" y="125.5" text-anchor="middle" dominant-baseline="central" >route-specific</text>
  <text class="ghostt" x="1138.0" y="140.5" text-anchor="middle" dominant-baseline="central" >effect</text>
  <line class="fb" x1="1031" y1="133.0" x2="1058" y2="133.0"/>
  <polygon class="fbhead" points="1056,125.0 1056,141.0 1070,133.0"/>
  <path class="fb" d="M1206 133.0 H1250 V153.0"/>
  <polygon class="fbhead" points="1242,151.0 1258,151.0 1250,165.0"/>
  <circle cx="935" cy="77" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M935 68 V86 M926 77 H944" stroke="#c0392b" stroke-width="1.2"/>
  <text class="redl" x="949" y="77" text-anchor="start" dominant-baseline="central" >intervention</text>
  <line class="rl" x1="963.0" y1="87" x2="963.0" y2="103"/>
  <rect class="dn" x="1140" y="69" width="170" height="34" />
  <text class="bi" x="1225" y="86" text-anchor="middle" dominant-baseline="central" >this route is blocked</text>
  <line class="cross" x1="1225" y1="103" x2="1225" y2="131.0"/>
  <rect class="dn" x="1110" y="315" width="200" height="34" />
  <text class="bi" x="1210" y="332" text-anchor="middle" dominant-baseline="central" >alternate route still works</text>
  <line class="cross" x1="1210" y1="315" x2="1210" y2="255.0"/>
  <text class="cap" x="1010.0" y="370" text-anchor="middle" dominant-baseline="central" >Blocking one step can remove one route without removing the capability.</text>

</svg>
