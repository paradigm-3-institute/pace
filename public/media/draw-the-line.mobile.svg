  <text class="b2" x="240.0" y="1315.0" text-anchor="middle" dominant-baseline="central" >Broader and narrower rules trade false positives</text>
  <text class="b2" x="240.0" y="1334.0" text-anchor="middle" dominant-baseline="central" >against false negatives. Better targeting can reduce</text>
