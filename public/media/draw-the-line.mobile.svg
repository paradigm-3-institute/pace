<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1396" viewBox="0 0 480 1396" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How you draw the line shapes what you catch</title>
  <desc id="dsc">Three panels compare a broader rule, a narrower rule and a more targeted rule on the same scatter of threat-relevant and benign activity. The broader rule misses fewer threats but constrains more other activity; the narrower rule misses more threats but constrains less; the targeted rule does well on both but requires more case-level information.</desc>
