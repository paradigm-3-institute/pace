<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="457" viewBox="0 0 1500 457" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Failure modes in pacing governance structures</title>
  <desc id="dsc">The rule creates enforcement machinery: a new actor with power and information. Its predictable failure modes are control, capture and misuse (used for purposes beyond the rule that justified it, such as surveillance powers turned on lawful research); behavioural distortions (optimised for the test, not the underlying risk); and persistence and precedent (outlasting the rule that created it, with emergency powers outstaying their welcome, though sometimes with useful spillover into diplomacy and national strategy).</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }
    </style>
  </defs>
  <rect width="1500" height="457" fill="#f3f6f9"/>
  <rect width="1500" height="457" fill="url(#grid)"/>
  <rect class="band" x="30" y="20" width="330" height="30" />
  <text class="ph" x="195.0" y="35" text-anchor="middle" dominant-baseline="central" >CREATED BY THE RULE</text>
  <rect class="band" x="400" y="20" width="1070" height="30" />
  <text class="ph" x="935.0" y="35" text-anchor="middle" dominant-baseline="central" >PREDICTABLE FAILURE MODES</text>
  <rect class="box" x="30" y="70" width="330" height="243" />
  <rect class="" x="30" y="261" width="330" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="30" y="70" width="330" height="243" />
  <line class="sep" x1="30" y1="106" x2="360" y2="106"/>
  <text class="hd" x="195.0" y="88" text-anchor="middle" dominant-baseline="central" >THE MACHINERY</text>
  <text class="b2" x="195.0" y="146.0" text-anchor="middle" dominant-baseline="central" >Enforcement power vested in a governing</text>
  <text class="b2" x="195.0" y="165.0" text-anchor="middle" dominant-baseline="central" >body (§4): some mix of access to private</text>
  <text class="b2" x="195.0" y="184.0" text-anchor="middle" dominant-baseline="central" >information, discretionary power to</text>
  <text class="b2" x="195.0" y="203.0" text-anchor="middle" dominant-baseline="central" >restrict other actors, and infrastructure</text>
  <text class="b2" x="195.0" y="222.0" text-anchor="middle" dominant-baseline="central" >for observation or verification.</text>
  <text class="lb" x="195.0" y="273" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT</text>
  <text class="ef" x="195.0" y="285.5" text-anchor="middle" dominant-baseline="central" >A NEW ACTOR WITH POWER AND</text>
  <text class="ef" x="195.0" y="300.5" text-anchor="middle" dominant-baseline="central" >INFORMATION</text>
  <path class="arr" d="M360 191.5 H372 Q380 191.5 380 183.5 V43 Q380 35 388 35 H388"/>
  <polygon class="head" points="386,27 386,43 400,35"/>
  <rect class="box" x="400" y="70" width="330" height="243" />
  <rect class="" x="400" y="261" width="330" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="400" y="70" width="330" height="243" />
  <line class="sep" x1="400" y1="106" x2="730" y2="106"/>
  <text class="hd" x="565.0" y="88" text-anchor="middle" dominant-baseline="central" >CONTROL, CAPTURE &amp; MISUSE</text>
  <text class="b2" x="565.0" y="136.5" text-anchor="middle" dominant-baseline="central" >Actors use power for their own goals. Once</text>
  <text class="b2" x="565.0" y="155.5" text-anchor="middle" dominant-baseline="central" >a body can inspect private information and</text>
  <text class="b2" x="565.0" y="174.5" text-anchor="middle" dominant-baseline="central" >restrict others, it becomes a target:</text>
  <text class="b2" x="565.0" y="193.5" text-anchor="middle" dominant-baseline="central" >firms lobby to be spared, other agencies</text>
  <text class="b2" x="565.0" y="212.5" text-anchor="middle" dominant-baseline="central" >compete for jurisdiction, and governments</text>
  <text class="b2" x="565.0" y="231.5" text-anchor="middle" dominant-baseline="central" >push it as political priorities shift.</text>
  <text class="lb" x="565.0" y="273" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT</text>
  <text class="ef" x="565.0" y="285.5" text-anchor="middle" dominant-baseline="central" >USED FOR PURPOSES BEYOND THE RULE</text>
  <text class="ef" x="565.0" y="300.5" text-anchor="middle" dominant-baseline="central" >THAT JUSTIFIED IT</text>
  <line class="rl" x1="565.0" y1="313" x2="565.0" y2="325"/>
  <circle class="note" cx="565.0" cy="334" r="9"/>
  <path d="M561.0 330 L569.0 338 M569.0 330 L561.0 338" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="565.0" y1="343" x2="565.0" y2="355"/>
  <rect class="note" x="400.0" y="355" width="330" height="48" />
  <text class="rd" x="565.0" y="373.0" text-anchor="middle" dominant-baseline="central" >SURVEILLANCE POWERS TURNED</text>
  <text class="rd" x="565.0" y="385.0" text-anchor="middle" dominant-baseline="central" >ON LAWFUL RESEARCH</text>
  <rect class="box" x="770" y="70" width="330" height="243" />
  <rect class="" x="770" y="261" width="330" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="770" y="70" width="330" height="243" />
  <line class="sep" x1="770" y1="106" x2="1100" y2="106"/>
  <text class="hd" x="935.0" y="88" text-anchor="middle" dominant-baseline="central" >BEHAVIOURAL DISTORTIONS</text>
  <text class="b2" x="935.0" y="127.0" text-anchor="middle" dominant-baseline="central" >No deliberate abuse required. Being</text>
  <text class="b2" x="935.0" y="146.0" text-anchor="middle" dominant-baseline="central" >watched, with the risk of leaks and</text>
  <text class="b2" x="935.0" y="165.0" text-anchor="middle" dominant-baseline="central" >misreading, deters research that looks</text>
  <text class="b2" x="935.0" y="184.0" text-anchor="middle" dominant-baseline="central" >reputationally risky. Measures that are</text>
  <text class="b2" x="935.0" y="203.0" text-anchor="middle" dominant-baseline="central" >easy to audit or publicly salient attract</text>
  <text class="b2" x="935.0" y="222.0" text-anchor="middle" dominant-baseline="central" >the effort, even where they track the</text>
  <text class="b2" x="935.0" y="241.0" text-anchor="middle" dominant-baseline="central" >underlying risk only imperfectly.</text>
  <text class="lb" x="935.0" y="273" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT</text>
  <text class="ef" x="935.0" y="285.5" text-anchor="middle" dominant-baseline="central" >OPTIMISED FOR THE TEST, NOT THE</text>
  <text class="ef" x="935.0" y="300.5" text-anchor="middle" dominant-baseline="central" >UNDERLYING RISK</text>
  <line class="rl" x1="935.0" y1="313" x2="935.0" y2="325"/>
  <circle class="note" cx="935.0" cy="334" r="9"/>
  <path d="M931.0 330 L939.0 338 M939.0 330 L931.0 338" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="935.0" y1="343" x2="935.0" y2="355"/>
  <rect class="note" x="770.0" y="355" width="330" height="48" />
  <text class="rd" x="935.0" y="373.0" text-anchor="middle" dominant-baseline="central" >PASSING TESTS DRIFTS FROM</text>
  <text class="rd" x="935.0" y="385.0" text-anchor="middle" dominant-baseline="central" >REDUCING RISK</text>
  <rect class="box" x="1140" y="70" width="330" height="243" />
  <rect class="" x="1140" y="261" width="330" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="1140" y="70" width="330" height="243" />
  <line class="sep" x1="1140" y1="106" x2="1470" y2="106"/>
  <text class="hd" x="1305.0" y="88" text-anchor="middle" dominant-baseline="central" >PERSISTENCE &amp; PRECEDENT</text>
  <text class="b2" x="1305.0" y="136.5" text-anchor="middle" dominant-baseline="central" >Powers and machinery are not necessarily</text>
  <text class="b2" x="1305.0" y="155.5" text-anchor="middle" dominant-baseline="central" >dismantled at exit (§4.4). Information,</text>
  <text class="b2" x="1305.0" y="174.5" text-anchor="middle" dominant-baseline="central" >once collected, is hard to keep out of</text>
  <text class="b2" x="1305.0" y="193.5" text-anchor="middle" dominant-baseline="central" >other decisions, and a remit widens simply</text>
  <text class="b2" x="1305.0" y="212.5" text-anchor="middle" dominant-baseline="central" >because the body already exists, however</text>
  <text class="b2" x="1305.0" y="231.5" text-anchor="middle" dominant-baseline="central" >imperfectly suited it is to the new task.</text>
  <text class="lb" x="1305.0" y="273" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT</text>
  <text class="ef" x="1305.0" y="293.0" text-anchor="middle" dominant-baseline="central" >OUTLASTS THE RULE THAT CREATED IT</text>
  <line class="rl" x1="1220.0" y1="313" x2="1220.0" y2="325"/>
  <circle class="note" cx="1220.0" cy="334" r="9"/>
  <path d="M1216.0 330 L1224.0 338 M1224.0 330 L1216.0 338" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="1220.0" y1="343" x2="1220.0" y2="355"/>
  <rect class="note" x="1140.0" y="355" width="160.0" height="72" />
  <text class="rd" x="1220.0" y="379.0" text-anchor="middle" dominant-baseline="central" >EMERGENCY POWERS</text>
  <text class="rd" x="1220.0" y="391.0" text-anchor="middle" dominant-baseline="central" >OUTSTAY THEIR</text>
  <text class="rd" x="1220.0" y="403.0" text-anchor="middle" dominant-baseline="central" >WELCOME</text>
  <line class="bll" x1="1390.0" y1="313" x2="1390.0" y2="325"/>
  <circle class="noteb" cx="1390.0" cy="334" r="9"/>
  <path d="M1390.0 329 V339 M1385.0 334 H1395.0" stroke="#4a6b8f" stroke-width="1.6"/>
  <line class="bll" x1="1390.0" y1="343" x2="1390.0" y2="355"/>
  <rect class="noteb" x="1310.0" y="355" width="160.0" height="72" />
  <text class="bl" x="1390.0" y="373.0" text-anchor="middle" dominant-baseline="central" >USEFUL SPILLOVER:</text>
  <text class="bl" x="1390.0" y="385.0" text-anchor="middle" dominant-baseline="central" >REUSE IN DIPLOMACY;</text>
  <text class="bl" x="1390.0" y="397.0" text-anchor="middle" dominant-baseline="central" >EXPERTISE INTO</text>
  <text class="bl" x="1390.0" y="409.0" text-anchor="middle" dominant-baseline="central" >NATIONAL STRATEGY</text>

</svg>
