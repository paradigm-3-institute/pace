      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }

      .hd { font-size: 16px; letter-spacing: 1px; }
      .bd { font-size: 20px; }
      .b2 { font-size: 18px; }
      .bi { font-size: 16px; }
      .ph { font-size: 12px; letter-spacing: .6px; }
      .rd { font-size: 11px; letter-spacing: .5px; }
      .axis { stroke: #1e2833; stroke-width: 2; fill: none; }
      .trajectory { stroke: #4a6b8f; stroke-width: 4; fill: none; }
      .catchup { stroke: #d0503c; stroke-width: 4; fill: none; }
    </style>
  </defs>
  <rect width="600" height="560" fill="#f3f6f9"/>
  <rect width="600" height="560" fill="url(#grid)"/>
<circle cx="300" cy="195" r="180" fill="#9fb3c8" fill-opacity="0.16"/><circle cx="205" cy="350" r="180" fill="#9fb3c8" fill-opacity="0.16"/><circle cx="395" cy="350" r="180" fill="#9fb3c8" fill-opacity="0.16"/><circle cx="300" cy="195" r="180" class="outline"/><circle cx="205" cy="350" r="180" class="outline"/><circle cx="395" cy="350" r="180" class="outline"/>  <text class="hd" x="300" y="88" text-anchor="middle" dominant-baseline="central" >SPEED</text>
  <text class="hd" x="128" y="385" text-anchor="middle" dominant-baseline="central" >LEGITIMACY</text>
  <text class="hd" x="472" y="385" text-anchor="middle" dominant-baseline="central" >PRECISION</text>
  <text class="b2" x="186" y="195.0" text-anchor="middle" dominant-baseline="central" >Automatic</text>
  <text class="b2" x="186" y="219.0" text-anchor="middle" dominant-baseline="central" >triggers</text>
  <text class="rd" x="186" y="243.5" text-anchor="middle" dominant-baseline="central" >RISK:</text>
  <text class="rd" x="186" y="258.5" text-anchor="middle" dominant-baseline="central" >MISTARGETING</text>
  <text class="b2" x="414" y="195.0" text-anchor="middle" dominant-baseline="central" >Expert</text>
  <text class="b2" x="414" y="219.0" text-anchor="middle" dominant-baseline="central" >discretion</text>
  <text class="rd" x="414" y="243.5" text-anchor="middle" dominant-baseline="central" >RISK:</text>
  <text class="rd" x="414" y="258.5" text-anchor="middle" dominant-baseline="central" >OVERREACH</text>
  <text class="b2" x="300" y="392.0" text-anchor="middle" dominant-baseline="central" >Deliberation and</text>
  <text class="b2" x="300" y="416.0" text-anchor="middle" dominant-baseline="central" >authorization</text>
  <text class="rd" x="300" y="440.5" text-anchor="middle" dominant-baseline="central" >RISK:</text>
  <text class="rd" x="300" y="455.5" text-anchor="middle" dominant-baseline="central" >SLOW RESPONSE</text>
  <text class="hd" x="300.0" y="309" text-anchor="middle" dominant-baseline="central" style="font-size:58px;letter-spacing:0">?</text>

</svg>
