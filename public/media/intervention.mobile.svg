<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1032" viewBox="0 0 480 1032" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Effect of blocking a targeted step</title>
  <desc id="dsc">Before intervention, pathway A runs through a targeted step and a route-specific effect to a capability, and pathway B reaches the same capability through an alternate route. After blocking the targeted step, that route is blocked but the alternate route still works: blocking one step can remove one route without removing the capability.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }
    </style>
  </defs>
  <rect width="480" height="1032" fill="#f3f6f9"/>
  <rect width="480" height="1032" fill="url(#grid)"/>
  <rect class="box" x="20" y="20" width="440" height="446" />
  <line class="sep" x1="20" y1="60" x2="460" y2="60"/>
  <text class="hd" x="240.0" y="40" text-anchor="middle" dominant-baseline="central" >BEFORE INTERVENTION</text>
  <rect class="box" x="40" y="90" width="170" height="56" />
  <text class="hs" x="125.0" y="118.0" text-anchor="middle" dominant-baseline="central" >pathway A</text>
  <rect class="box" x="270" y="90" width="170" height="56" />
  <text class="hs" x="355.0" y="118.0" text-anchor="middle" dominant-baseline="central" >pathway B</text>
  <rect class="box" x="270" y="170" width="170" height="56" />
  <text class="hs" x="355.0" y="198.0" text-anchor="middle" dominant-baseline="central" >alternate route</text>
  <line class="arr" x1="90" y1="146" x2="90" y2="158"/>
  <polygon class="head" points="82,156 98,156 90,170"/>
  <rect class="box" x="60" y="340" width="360" height="56" />
  <text class="hs" x="240.0" y="368.0" text-anchor="middle" dominant-baseline="central" >capability</text>
  <line class="arr" x1="285" y1="226" x2="285" y2="328"/>
  <polygon class="head" points="277,326 293,326 285,340"/>
  <rect class="red" x="40" y="170" width="170" height="56" />
  <text class="redt" x="125.0" y="198.0" text-anchor="middle" dominant-baseline="central" >targeted step</text>
  <rect class="box" x="40" y="250" width="170" height="56" />
  <text class="hs" x="125.0" y="270.5" text-anchor="middle" dominant-baseline="central" >route-specific</text>
  <text class="hs" x="125.0" y="285.5" text-anchor="middle" dominant-baseline="central" >effect</text>
  <line class="arr" x1="90" y1="226" x2="90" y2="238"/>
  <polygon class="head" points="82,236 98,236 90,250"/>
  <line class="arr" x1="90" y1="306" x2="90" y2="328"/>
  <polygon class="head" points="82,326 98,326 90,340"/>
  <text class="cap" x="240.0" y="425.0" text-anchor="middle" dominant-baseline="central" >Two different pathways can lead</text>
  <text class="cap" x="240.0" y="439.0" text-anchor="middle" dominant-baseline="central" >to the same capability.</text>
  <rect class="box" x="20" y="496" width="440" height="516" />
  <line class="sep" x1="20" y1="536" x2="460" y2="536"/>
  <text class="hd" x="240.0" y="516" text-anchor="middle" dominant-baseline="central" >AFTER BLOCKING THE TARGETED STEP</text>
  <rect class="box" x="40" y="566" width="170" height="56" />
  <text class="hs" x="125.0" y="594.0" text-anchor="middle" dominant-baseline="central" >pathway A</text>
  <rect class="box" x="270" y="566" width="170" height="56" />
  <text class="hs" x="355.0" y="594.0" text-anchor="middle" dominant-baseline="central" >pathway B</text>
  <rect class="box" x="270" y="646" width="170" height="56" />
  <text class="hs" x="355.0" y="674.0" text-anchor="middle" dominant-baseline="central" >alternate route</text>
  <line class="arr" x1="90" y1="622" x2="90" y2="634"/>
  <polygon class="head" points="82,632 98,632 90,646"/>
  <rect class="box" x="60" y="886" width="360" height="56" />
  <text class="hs" x="240.0" y="914.0" text-anchor="middle" dominant-baseline="central" >capability</text>
  <line class="arr" x1="285" y1="702" x2="285" y2="874"/>
  <polygon class="head" points="277,872 293,872 285,886"/>
  <rect class="ghost" x="40" y="646" width="170" height="56" />
  <line class="cross" x1="40" y1="646" x2="210" y2="702"/>
  <line class="cross" x1="210" y1="646" x2="40" y2="702"/>
  <rect class="red" x="40" y="646" width="170" height="56" fill="none" stroke-dasharray="5 4"/>
  <text class="redt" x="125.0" y="674.0" text-anchor="middle" dominant-baseline="central" >targeted step</text>
  <rect class="ghost" x="40" y="726" width="170" height="56" />
  <text class="ghostt" x="125.0" y="746.5" text-anchor="middle" dominant-baseline="central" >route-specific</text>
  <text class="ghostt" x="125.0" y="761.5" text-anchor="middle" dominant-baseline="central" >effect</text>
  <line class="cross" x1="40" y1="726" x2="210" y2="782"/>
  <line class="cross" x1="210" y1="726" x2="40" y2="782"/>
  <line class="fb" x1="90" y1="702" x2="90" y2="714"/>
  <polygon class="fbhead" points="82,712 98,712 90,726"/>
  <line class="fb" x1="90" y1="782" x2="90" y2="874"/>
  <polygon class="fbhead" points="82,872 98,872 90,886"/>
  <circle cx="118" cy="634" r="6" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M118 625 V643 M109 634 H127" stroke="#c0392b" stroke-width="1.2"/>
  <text class="redl" x="210" y="634" text-anchor="end" dominant-baseline="central" >intervention</text>
  <line class="cross" x1="90" y1="826" x2="102" y2="826"/>
  <rect class="dn" x="102" y="806" width="100" height="40" />
  <text class="bi" x="152" y="818.5" text-anchor="middle" dominant-baseline="central" >this route</text>
  <text class="bi" x="152" y="833.5" text-anchor="middle" dominant-baseline="central" >is blocked</text>
  <line class="cross" x1="285" y1="754" x2="297" y2="754"/>
  <rect class="dn" x="297" y="732" width="128" height="44" />
  <text class="bi" x="361" y="746.5" text-anchor="middle" dominant-baseline="central" >alternate route</text>
  <text class="bi" x="361" y="761.5" text-anchor="middle" dominant-baseline="central" >still works</text>
  <text class="cap" x="240.0" y="971.0" text-anchor="middle" dominant-baseline="central" >Blocking one step can remove one route</text>
  <text class="cap" x="240.0" y="985.0" text-anchor="middle" dominant-baseline="central" >without removing the capability.</text>

</svg>
