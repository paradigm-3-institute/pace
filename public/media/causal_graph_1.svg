<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Causal graph of a pacing intervention</title>
  <desc id="dsc">Pacing intervention causes adaptation, which causes AI slowdown, which causes risk mitigation. Pacing intervention also causes safety progress, which causes risk mitigation without going through slowdown. AI slowdown also delays benefits.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #1e2833; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 18px; fill: #2f3b4b; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#f3f6f9"/>
  <rect width="1200" height="680" fill="url(#grid)"/>

  <g>
    <rect class="box" x="488" y="60" width="224" height="140"/>
    <line class="sep" x1="488" y1="102" x2="712" y2="102"/>
    <text class="hd" x="600" y="81" text-anchor="middle" dominant-baseline="central">SAFETY PROGRESS</text>
    <text class="bd" x="600" y="151" text-anchor="middle" dominant-baseline="central">defenses and diffusion</text>
  </g>

  <g>
    <rect class="box" x="62" y="270" width="224" height="140"/>
    <line class="sep" x1="62" y1="312" x2="286" y2="312"/>
    <text class="hd" x="174" y="291" text-anchor="middle" dominant-baseline="central">PACING INTERVENTION</text>
    <text class="bd" x="174" y="361" text-anchor="middle" dominant-baseline="central">caps · monitors · rules</text>
  </g>

  <g>
    <rect class="box" x="346" y="270" width="224" height="140"/>
    <line class="sep" x1="346" y1="312" x2="570" y2="312"/>
    <text class="hd" x="458" y="291" text-anchor="middle" dominant-baseline="central">RESPONSE</text>
    <text class="bd" x="458" y="361" text-anchor="middle" dominant-baseline="central">actors re-optimize</text>
  </g>

  <g>
    <rect class="box" x="630" y="270" width="224" height="140"/>
    <line class="sep" x1="630" y1="312" x2="854" y2="312"/>
    <text class="hd" x="742" y="291" text-anchor="middle" dominant-baseline="central">AI SLOWDOWN</text>
    <text class="bd" x="742" y="361" text-anchor="middle" dominant-baseline="central">net of substitution</text>
  </g>

  <g>
    <rect class="box-out" x="914" y="270" width="224" height="140"/>
    <line class="sep" x1="914" y1="312" x2="1138" y2="312"/>
    <text class="hd" x="1026" y="291" text-anchor="middle" dominant-baseline="central">RISK MITIGATION</text>
    <text class="bd" x="1026" y="361" text-anchor="middle" dominant-baseline="central">less threat</text>
  </g>

  <line class="arr" x1="288" y1="340" x2="331" y2="340"/>
  <polygon class="head" points="330,332 330,348 344,340"/>

  <line class="arr" x1="572" y1="340" x2="615" y2="340"/>
  <polygon class="head" points="614,332 614,348 628,340"/>

  <line class="arr" x1="856" y1="340" x2="899" y2="340"/>
  <polygon class="head" points="898,332 898,348 912,340"/>

  <path class="arr" d="M174 268 V142 Q174 130 186 130 H472"/>
  <polygon class="head" points="472,122 472,138 486,130"/>

  <path class="arr" d="M714 130 H1014 Q1026 130 1026 142 V254"/>
  <polygon class="head" points="1018,254 1034,254 1026,268"/>
  <g>
    <rect class="box-out" x="630" y="480" width="224" height="140"/>
    <line class="sep" x1="630" y1="522" x2="854" y2="522"/>
    <text class="hd" x="742" y="501" text-anchor="middle" dominant-baseline="central">DELAYED BENEFITS</text>
    <text class="bd" x="742" y="571" text-anchor="middle" dominant-baseline="central">growth · science</text>
  </g>

  <line class="arr" x1="742" y1="412" x2="742" y2="466"/>
  <polygon class="head" points="734,466 750,466 742,480"/>

</svg>
