  <text class="bd" x="1223.3333333333335" y="229.0" text-anchor="middle" dominant-baseline="central" >release</text>
  <text class="bd" x="1223.3333333333335" y="251.0" text-anchor="middle" dominant-baseline="central" >downstream use</text>
