  <rect class="band" x="15" y="20" width="300" height="44" />
<g id="direction" data-bounds="27 32 276 20">
  <text class="ph" x="165.0" y="42.0" text-anchor="middle" dominant-baseline="central" >OUTWARD THROUGH SOCIETY</text>
</g>
  <line class="arr" x1="330" y1="42" x2="1473" y2="42"/>
  <polygon class="head" points="1471,34 1471,50 1485,42"/>
  <rect class="box" x="15" y="92" width="220" height="353.0" />
  <rect class="" x="15" y="347.0" width="220" height="98" fill="#e4ebf2"/>
  <rect class="outline" x="15" y="92" width="220" height="353.0" />
  <line class="sep" x1="15" y1="150.5" x2="235" y2="150.5"/>
<g id="stage-0-heading" data-bounds="35 104 180 34.5">
  <text class="hd" x="125.0" y="121.25" text-anchor="middle" dominant-baseline="central" >THE RULE</text>
</g>
<g id="stage-0-body" data-bounds="39 172.5 172 152.5">
  <text class="b2" x="125.0" y="214.25" text-anchor="middle" dominant-baseline="central" >The pacing rule:</text>
  <text class="b2" x="125.0" y="237.25" text-anchor="middle" dominant-baseline="central" >scope, trigger,</text>
  <text class="b2" x="125.0" y="260.25" text-anchor="middle" dominant-baseline="central" >control surface and</text>
  <text class="b2" x="125.0" y="283.25" text-anchor="middle" dominant-baseline="central" >exit.</text>
</g>
<g id="stage-0-reference" data-bounds="31 357.0 188 12">
  <text class="lb" x="125.0" y="363.0" text-anchor="middle" dominant-baseline="central" >CHANGES</text>
</g>
<g id="stage-0-effect" data-bounds="39 379.0 172 52">
  <text class="ef" x="125.0" y="395.5" text-anchor="middle" dominant-baseline="central" >CONSTRAINTS, NOT</text>
  <text class="ef" x="125.0" y="414.5" text-anchor="middle" dominant-baseline="central" >OBJECTIVES</text>
</g>
  <rect class="band" x="15" y="465.0" width="220" height="53.5" />
<g id="timing-0" data-bounds="29 479.0 192 25.5">
  <text class="ph" x="125.0" y="491.75" text-anchor="middle" dominant-baseline="central" >WHEN IT LANDS</text>
</g>
  <line class="arr" x1="235" y1="268.5" x2="253" y2="268.5"/>
  <polygon class="head" points="251,260.5 251,276.5 265,268.5"/>
  <rect class="box" x="265" y="92" width="220" height="353.0" />
  <rect class="" x="265" y="347.0" width="220" height="98" fill="#e4ebf2"/>
  <rect class="outline" x="265" y="92" width="220" height="353.0" />
  <line class="sep" x1="265" y1="150.5" x2="485" y2="150.5"/>
<g id="stage-1-heading" data-bounds="285 104 180 34.5">
  <text class="hd" x="375.0" y="121.25" text-anchor="middle" dominant-baseline="central" >COVERED DEVELOPERS</text>
</g>
<g id="stage-1-body" data-bounds="289 172.5 172 152.5">
  <text class="b2" x="375.0" y="191.25" text-anchor="middle" dominant-baseline="central" >Developers retain</text>
  <text class="b2" x="375.0" y="214.25" text-anchor="middle" dominant-baseline="central" >their objectives,</text>
  <text class="b2" x="375.0" y="237.25" text-anchor="middle" dominant-baseline="central" >adapting within the</text>
  <text class="b2" x="375.0" y="260.25" text-anchor="middle" dominant-baseline="central" >rule, working around</text>
  <text class="b2" x="375.0" y="283.25" text-anchor="middle" dominant-baseline="central" >it, or seeking to</text>
  <text class="b2" x="375.0" y="306.25" text-anchor="middle" dominant-baseline="central" >change it.</text>
</g>
<g id="stage-1-reference" data-bounds="281 357.0 188 12">
  <text class="lb" x="375.0" y="363.0" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.1</text>
</g>
<g id="stage-1-effect" data-bounds="289 379.0 172 52">
  <text class="ef" x="375.0" y="386.0" text-anchor="middle" dominant-baseline="central" >THE RULE IN PRACTICE</text>
  <text class="ef" x="375.0" y="405.0" text-anchor="middle" dominant-baseline="central" >= RULE + BEST</text>
  <text class="ef" x="375.0" y="424.0" text-anchor="middle" dominant-baseline="central" >RESPONSE</text>
</g>
  <rect class="band" x="265" y="465.0" width="220" height="53.5" />
<g id="timing-1" data-bounds="279 479.0 192 25.5">
  <text class="ph" x="375.0" y="491.75" text-anchor="middle" dominant-baseline="central" >ON ENACTMENT</text>
</g>
  <line class="arr" x1="485" y1="268.5" x2="503" y2="268.5"/>
  <polygon class="head" points="501,260.5 501,276.5 515,268.5"/>
  <rect class="box" x="515" y="92" width="220" height="353.0" />
  <rect class="" x="515" y="347.0" width="220" height="98" fill="#e4ebf2"/>
  <rect class="outline" x="515" y="92" width="220" height="353.0" />
  <line class="sep" x1="515" y1="150.5" x2="735" y2="150.5"/>
<g id="stage-2-heading" data-bounds="535 104 180 34.5">
  <text class="hd" x="625.0" y="121.25" text-anchor="middle" dominant-baseline="central" >RELATIVE POWER</text>
</g>
<g id="stage-2-body" data-bounds="539 172.5 172 152.5">
  <text class="b2" x="625.0" y="179.75" text-anchor="middle" dominant-baseline="central" >Governments,</text>
  <text class="b2" x="625.0" y="202.75" text-anchor="middle" dominant-baseline="central" >non-covered developers</text>
  <text class="b2" x="625.0" y="225.75" text-anchor="middle" dominant-baseline="central" >and adversaries</text>
  <text class="b2" x="625.0" y="248.75" text-anchor="middle" dominant-baseline="central" >exploit, absorb or</text>
  <text class="b2" x="625.0" y="271.75" text-anchor="middle" dominant-baseline="central" >evade pacing's</text>
  <text class="b2" x="625.0" y="294.75" text-anchor="middle" dominant-baseline="central" >opportunities and</text>
  <text class="b2" x="625.0" y="317.75" text-anchor="middle" dominant-baseline="central" >constraints.</text>
</g>
<g id="stage-2-reference" data-bounds="531 357.0 188 12">
  <text class="lb" x="625.0" y="363.0" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.2</text>
</g>
<g id="stage-2-effect" data-bounds="539 379.0 172 52">
  <text class="ef" x="625.0" y="386.0" text-anchor="middle" dominant-baseline="central" >FRONTIER</text>
  <text class="ef" x="625.0" y="405.0" text-anchor="middle" dominant-baseline="central" >COMMODITIZES; MORE</text>
  <text class="ef" x="625.0" y="424.0" text-anchor="middle" dominant-baseline="central" >ACTORS TO MONITOR</text>
</g>
  <rect class="band" x="515" y="465.0" width="220" height="53.5" />
<g id="timing-2" data-bounds="529 479.0 192 25.5">
  <text class="ph" x="625.0" y="491.75" text-anchor="middle" dominant-baseline="central" >FROM ENACTMENT ONWARD</text>
</g>
  <line class="arr" x1="735" y1="268.5" x2="753" y2="268.5"/>
  <polygon class="head" points="751,260.5 751,276.5 765,268.5"/>
  <rect class="box" x="765" y="92" width="220" height="353.0" />
  <rect class="" x="765" y="347.0" width="220" height="98" fill="#e4ebf2"/>
  <rect class="outline" x="765" y="92" width="220" height="353.0" />
  <line class="sep" x1="765" y1="150.5" x2="985" y2="150.5"/>
<g id="stage-3-heading" data-bounds="785 104 180 34.5">
  <text class="hd" x="875.0" y="110.75" text-anchor="middle" dominant-baseline="central" >GOVERNANCE</text>
  <text class="hd" x="875.0" y="131.75" text-anchor="middle" dominant-baseline="central" >MACHINERY</text>
</g>
<g id="stage-3-body" data-bounds="789 172.5 172 152.5">
  <text class="b2" x="875.0" y="191.25" text-anchor="middle" dominant-baseline="central" >Pacing creates</text>
  <text class="b2" x="875.0" y="214.25" text-anchor="middle" dominant-baseline="central" >governance machinery</text>
  <text class="b2" x="875.0" y="237.25" text-anchor="middle" dominant-baseline="central" >with powers to inspect</text>
  <text class="b2" x="875.0" y="260.25" text-anchor="middle" dominant-baseline="central" >and enforce, making it</text>
  <text class="b2" x="875.0" y="283.25" text-anchor="middle" dominant-baseline="central" >a target for capture</text>
  <text class="b2" x="875.0" y="306.25" text-anchor="middle" dominant-baseline="central" >and distortion.</text>
</g>
<g id="stage-3-reference" data-bounds="781 357.0 188 12">
  <text class="lb" x="875.0" y="363.0" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.3</text>
</g>
<g id="stage-3-effect" data-bounds="789 379.0 172 52">
  <text class="ef" x="875.0" y="395.5" text-anchor="middle" dominant-baseline="central" >MAY OUTLAST THE RULE</text>
  <text class="ef" x="875.0" y="414.5" text-anchor="middle" dominant-baseline="central" >THAT JUSTIFIED IT</text>
</g>
  <rect class="band" x="765" y="465.0" width="220" height="53.5" />
<g id="timing-3" data-bounds="779 479.0 192 25.5">
  <text class="ph" x="875.0" y="484.25" text-anchor="middle" dominant-baseline="central" >AT ACTIVATION; MAY</text>
  <text class="ph" x="875.0" y="499.25" text-anchor="middle" dominant-baseline="central" >PERSIST PAST EXIT</text>
</g>
  <line class="arr" x1="985" y1="268.5" x2="1003" y2="268.5"/>
  <polygon class="head" points="1001,260.5 1001,276.5 1015,268.5"/>
  <rect class="box" x="1015" y="92" width="220" height="353.0" />
  <rect class="" x="1015" y="347.0" width="220" height="98" fill="#e4ebf2"/>
  <rect class="outline" x="1015" y="92" width="220" height="353.0" />
  <line class="sep" x1="1015" y1="150.5" x2="1235" y2="150.5"/>
<g id="stage-4-heading" data-bounds="1035 104 180 34.5">
  <text class="hd" x="1125.0" y="110.75" text-anchor="middle" dominant-baseline="central" >INVESTMENT &amp;</text>
  <text class="hd" x="1125.0" y="131.75" text-anchor="middle" dominant-baseline="central" >MARKETS</text>
</g>
<g id="stage-4-body" data-bounds="1039 172.5 172 152.5">
  <text class="b2" x="1125.0" y="191.25" text-anchor="middle" dominant-baseline="central" >Valuations reprice</text>
  <text class="b2" x="1125.0" y="214.25" text-anchor="middle" dominant-baseline="central" >before capabilities</text>
  <text class="b2" x="1125.0" y="237.25" text-anchor="middle" dominant-baseline="central" >change; leveraged</text>
  <text class="b2" x="1125.0" y="260.25" text-anchor="middle" dominant-baseline="central" >projects may strand,</text>
  <text class="b2" x="1125.0" y="283.25" text-anchor="middle" dominant-baseline="central" >and restrained actors</text>
  <text class="b2" x="1125.0" y="306.25" text-anchor="middle" dominant-baseline="central" >seek compensation.</text>
</g>
<g id="stage-4-reference" data-bounds="1031 357.0 188 12">
  <text class="lb" x="1125.0" y="363.0" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.4</text>
</g>
<g id="stage-4-effect" data-bounds="1039 379.0 172 52">
  <text class="ef" x="1125.0" y="395.5" text-anchor="middle" dominant-baseline="central" >LIKELY THE MOST</text>
  <text class="ef" x="1125.0" y="414.5" text-anchor="middle" dominant-baseline="central" >IMMEDIATE EFFECT</text>
</g>
  <rect class="band" x="1015" y="465.0" width="220" height="53.5" />
<g id="timing-4" data-bounds="1029 479.0 192 25.5">
  <text class="ph" x="1125.0" y="484.25" text-anchor="middle" dominant-baseline="central" >ON EXPECTATION, BEFORE</text>
  <text class="ph" x="1125.0" y="499.25" text-anchor="middle" dominant-baseline="central" >ANY DIRECT EFFECT</text>
</g>
  <line class="arr" x1="1235" y1="268.5" x2="1253" y2="268.5"/>
  <polygon class="head" points="1251,260.5 1251,276.5 1265,268.5"/>
  <rect class="box" x="1265" y="92" width="220" height="353.0" />
  <rect class="" x="1265" y="347.0" width="220" height="98" fill="#e4ebf2"/>
  <rect class="outline" x="1265" y="92" width="220" height="353.0" />
  <line class="sep" x1="1265" y1="150.5" x2="1485" y2="150.5"/>
<g id="stage-5-heading" data-bounds="1285 104 180 34.5">
  <text class="hd" x="1375.0" y="121.25" text-anchor="middle" dominant-baseline="central" >NORMS &amp; CULTURE</text>
</g>
<g id="stage-5-body" data-bounds="1289 172.5 172 152.5">
  <text class="b2" x="1375.0" y="191.25" text-anchor="middle" dominant-baseline="central" >Frontier prestige</text>
  <text class="b2" x="1375.0" y="214.25" text-anchor="middle" dominant-baseline="central" >falls and talent</text>
  <text class="b2" x="1375.0" y="237.25" text-anchor="middle" dominant-baseline="central" >self-selects; credit</text>
  <text class="b2" x="1375.0" y="260.25" text-anchor="middle" dominant-baseline="central" >for prevention is</text>
  <text class="b2" x="1375.0" y="283.25" text-anchor="middle" dominant-baseline="central" >invisible while blame</text>
  <text class="b2" x="1375.0" y="306.25" text-anchor="middle" dominant-baseline="central" >for harm is not.</text>
</g>
<g id="stage-5-reference" data-bounds="1281 357.0 188 12">
  <text class="lb" x="1375.0" y="363.0" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.5</text>
</g>
<g id="stage-5-effect" data-bounds="1289 379.0 172 52">
  <text class="ef" x="1375.0" y="395.5" text-anchor="middle" dominant-baseline="central" >SETS THE TERMS FOR</text>
  <text class="ef" x="1375.0" y="414.5" text-anchor="middle" dominant-baseline="central" >THE NEXT INTERVENTION</text>
</g>
  <rect class="band" x="1265" y="465.0" width="220" height="53.5" />
<g id="timing-5" data-bounds="1279 479.0 192 25.5">
  <text class="ph" x="1375.0" y="484.25" text-anchor="middle" dominant-baseline="central" >AFTERWARD; SHAPES THE</text>
  <text class="ph" x="1375.0" y="499.25" text-anchor="middle" dominant-baseline="central" >NEXT INTERVENTION</text>
</g>

</svg>
