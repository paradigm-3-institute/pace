<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="542.5" viewBox="0 0 1500 542.5" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Effects of a pacing intervention, outward through society</title>
  <desc id="dsc">Six stages, outward through society and forward in time: the rule as written; covered developers re-optimizing; relative power shifting as others read the pace; governance machinery that may outlast the rule; investment and markets repricing on expectation; and norms and culture that set the terms for the next intervention.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
