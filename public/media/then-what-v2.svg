<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="383" viewBox="0 0 1500 383" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Effects of a pacing intervention, outward through society</title>
  <desc id="dsc">Six stages, outward through society and forward in time: the rule as written; covered developers re-optimising; relative power shifting as others read the pace; governance machinery that may outlast the rule; investment and markets repricing on expectation; and norms and culture that set the terms for the next intervention.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }

      .hd { font-size: 13.5px; }
      .b2 { font-size: 14.5px; }
      .ef { font-size: 12.5px; }
      .lb, .ph { font-size: 10.5px; }
    </style>
  </defs>
  <rect width="1500" height="383" fill="#f3f6f9"/>
  <rect width="1500" height="383" fill="url(#grid)"/>
  <rect class="band" x="15" y="20" width="300" height="34" />
  <text class="ph" x="165" y="37" text-anchor="middle" dominant-baseline="central" >OUTWARDS THROUGH SOCIETY</text>
  <line class="arr" x1="330" y1="37" x2="1473" y2="37"/>
  <polygon class="head" points="1471,29 1471,45 1485,37"/>
  <rect class="box" x="15" y="75" width="220" height="224" />
  <rect class="" x="15" y="247" width="220" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="15" y="75" width="220" height="224" />
  <line class="sep" x1="15" y1="111" x2="235" y2="111"/>
  <text class="hd" x="125.0" y="93" text-anchor="middle" dominant-baseline="central" >THE RULE</text>
  <text class="b2" x="125.0" y="160.5" text-anchor="middle" dominant-baseline="central" >The pacing rule: scope,</text>
  <text class="b2" x="125.0" y="179.5" text-anchor="middle" dominant-baseline="central" >trigger, control surface</text>
  <text class="b2" x="125.0" y="198.5" text-anchor="middle" dominant-baseline="central" >and exit.</text>
  <text class="lb" x="125.0" y="259" text-anchor="middle" dominant-baseline="central" font-size="7px">CHANGES</text>
  <text class="ef" x="125.0" y="271.5" text-anchor="middle" dominant-baseline="central" >CONSTRAINTS, NOT</text>
  <text class="ef" x="125.0" y="286.5" text-anchor="middle" dominant-baseline="central" >OBJECTIVES</text>
  <rect class="band" x="15" y="315" width="220" height="44" />
  <text class="ph" x="125.0" y="337.0" text-anchor="middle" dominant-baseline="central" >WHEN IT LANDS</text>
  <line class="arr" x1="235" y1="187.0" x2="253" y2="187.0"/>
  <polygon class="head" points="251,179.0 251,195.0 265,187.0"/>
  <rect class="box" x="265" y="75" width="220" height="224" />
  <rect class="" x="265" y="247" width="220" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="265" y="75" width="220" height="224" />
  <line class="sep" x1="265" y1="111" x2="485" y2="111"/>
  <text class="hd" x="375.0" y="93" text-anchor="middle" dominant-baseline="central" >COVERED DEVELOPERS</text>
  <text class="b2" x="375.0" y="141.5" text-anchor="middle" dominant-baseline="central" >Developers retain their</text>
  <text class="b2" x="375.0" y="160.5" text-anchor="middle" dominant-baseline="central" >objectives, adapting</text>
  <text class="b2" x="375.0" y="179.5" text-anchor="middle" dominant-baseline="central" >within the rule, working</text>
  <text class="b2" x="375.0" y="198.5" text-anchor="middle" dominant-baseline="central" >around it, or seeking to</text>
  <text class="b2" x="375.0" y="217.5" text-anchor="middle" dominant-baseline="central" >change it.</text>
  <text class="lb" x="375.0" y="259" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.1</text>
  <text class="ef" x="375.0" y="271.5" text-anchor="middle" dominant-baseline="central" >THE RULE IN PRACTICE =</text>
  <text class="ef" x="375.0" y="286.5" text-anchor="middle" dominant-baseline="central" >RULE + BEST RESPONSE</text>
  <rect class="band" x="265" y="315" width="220" height="44" />
  <text class="ph" x="375.0" y="337.0" text-anchor="middle" dominant-baseline="central" >ON ENACTMENT</text>
  <line class="arr" x1="485" y1="187.0" x2="503" y2="187.0"/>
  <polygon class="head" points="501,179.0 501,195.0 515,187.0"/>
  <rect class="box" x="515" y="75" width="220" height="224" />
  <rect class="" x="515" y="247" width="220" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="515" y="75" width="220" height="224" />
  <line class="sep" x1="515" y1="111" x2="735" y2="111"/>
  <text class="hd" x="625.0" y="93" text-anchor="middle" dominant-baseline="central" >RELATIVE POWER</text>
  <text class="b2" x="625.0" y="141.5" text-anchor="middle" dominant-baseline="central" >Governments, non-covered</text>
  <text class="b2" x="625.0" y="160.5" text-anchor="middle" dominant-baseline="central" >developers and adversaries</text>
  <text class="b2" x="625.0" y="179.5" text-anchor="middle" dominant-baseline="central" >exploit, absorb or evade</text>
  <text class="b2" x="625.0" y="198.5" text-anchor="middle" dominant-baseline="central" >pacing's opportunities and</text>
  <text class="b2" x="625.0" y="217.5" text-anchor="middle" dominant-baseline="central" >constraints.</text>
  <text class="lb" x="625.0" y="259" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.2</text>
  <text class="ef" x="625.0" y="271.5" text-anchor="middle" dominant-baseline="central" >FRONTIER COMMODITISES;</text>
  <text class="ef" x="625.0" y="286.5" text-anchor="middle" dominant-baseline="central" >MORE ACTORS TO MONITOR</text>
  <rect class="band" x="515" y="315" width="220" height="44" />
  <text class="ph" x="625.0" y="337.0" text-anchor="middle" dominant-baseline="central" >FROM ENACTMENT ONWARDS</text>
  <line class="arr" x1="735" y1="187.0" x2="753" y2="187.0"/>
  <polygon class="head" points="751,179.0 751,195.0 765,187.0"/>
  <rect class="box" x="765" y="75" width="220" height="224" />
  <rect class="" x="765" y="247" width="220" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="765" y="75" width="220" height="224" />
  <line class="sep" x1="765" y1="111" x2="985" y2="111"/>
  <text class="hd" x="875.0" y="93" text-anchor="middle" dominant-baseline="central" >GOVERNANCE MACHINERY</text>
  <text class="b2" x="875.0" y="141.5" text-anchor="middle" dominant-baseline="central" >Pacing creates governance</text>
  <text class="b2" x="875.0" y="160.5" text-anchor="middle" dominant-baseline="central" >machinery with powers to</text>
  <text class="b2" x="875.0" y="179.5" text-anchor="middle" dominant-baseline="central" >inspect and enforce,</text>
  <text class="b2" x="875.0" y="198.5" text-anchor="middle" dominant-baseline="central" >making it a target for</text>
  <text class="b2" x="875.0" y="217.5" text-anchor="middle" dominant-baseline="central" >capture and distortion.</text>
  <text class="lb" x="875.0" y="259" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.3</text>
  <text class="ef" x="875.0" y="271.5" text-anchor="middle" dominant-baseline="central" >MAY OUTLAST THE RULE</text>
  <text class="ef" x="875.0" y="286.5" text-anchor="middle" dominant-baseline="central" >THAT JUSTIFIED IT</text>
  <rect class="band" x="765" y="315" width="220" height="44" />
  <text class="ph" x="875.0" y="330.5" text-anchor="middle" dominant-baseline="central" >AT ACTIVATION; MAY</text>
  <text class="ph" x="875.0" y="343.5" text-anchor="middle" dominant-baseline="central" >PERSIST PAST EXIT</text>
  <line class="arr" x1="985" y1="187.0" x2="1003" y2="187.0"/>
  <polygon class="head" points="1001,179.0 1001,195.0 1015,187.0"/>
  <rect class="box" x="1015" y="75" width="220" height="224" />
  <rect class="" x="1015" y="247" width="220" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="1015" y="75" width="220" height="224" />
  <line class="sep" x1="1015" y1="111" x2="1235" y2="111"/>
  <text class="hd" x="1125.0" y="93" text-anchor="middle" dominant-baseline="central" >INVESTMENT &amp; MARKETS</text>
  <text class="b2" x="1125.0" y="141.5" text-anchor="middle" dominant-baseline="central" >Valuations reprice before</text>
  <text class="b2" x="1125.0" y="160.5" text-anchor="middle" dominant-baseline="central" >capabilities change;</text>
  <text class="b2" x="1125.0" y="179.5" text-anchor="middle" dominant-baseline="central" >leveraged projects may</text>
  <text class="b2" x="1125.0" y="198.5" text-anchor="middle" dominant-baseline="central" >strand, and restrained</text>
  <text class="b2" x="1125.0" y="217.5" text-anchor="middle" dominant-baseline="central" >actors seek compensation.</text>
  <text class="lb" x="1125.0" y="259" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.4</text>
  <text class="ef" x="1125.0" y="271.5" text-anchor="middle" dominant-baseline="central" >LIKELY THE MOST</text>
  <text class="ef" x="1125.0" y="286.5" text-anchor="middle" dominant-baseline="central" >IMMEDIATE EFFECT</text>
  <rect class="band" x="1015" y="315" width="220" height="44" />
  <text class="ph" x="1125.0" y="330.5" text-anchor="middle" dominant-baseline="central" >ON EXPECTATION, BEFORE</text>
  <text class="ph" x="1125.0" y="343.5" text-anchor="middle" dominant-baseline="central" >ANY DIRECT EFFECT</text>
  <line class="arr" x1="1235" y1="187.0" x2="1253" y2="187.0"/>
  <polygon class="head" points="1251,179.0 1251,195.0 1265,187.0"/>
  <rect class="box" x="1265" y="75" width="220" height="224" />
  <rect class="" x="1265" y="247" width="220" height="52" fill="#e4ebf2"/>
  <rect class="outline" x="1265" y="75" width="220" height="224" />
  <line class="sep" x1="1265" y1="111" x2="1485" y2="111"/>
  <text class="hd" x="1375.0" y="93" text-anchor="middle" dominant-baseline="central" >NORMS &amp; CULTURE</text>
  <text class="b2" x="1375.0" y="141.5" text-anchor="middle" dominant-baseline="central" >Frontier prestige falls</text>
  <text class="b2" x="1375.0" y="160.5" text-anchor="middle" dominant-baseline="central" >and talent self-selects;</text>
  <text class="b2" x="1375.0" y="179.5" text-anchor="middle" dominant-baseline="central" >credit for prevention is</text>
  <text class="b2" x="1375.0" y="198.5" text-anchor="middle" dominant-baseline="central" >invisible while blame for</text>
  <text class="b2" x="1375.0" y="217.5" text-anchor="middle" dominant-baseline="central" >harm is not.</text>
  <text class="lb" x="1375.0" y="259" text-anchor="middle" dominant-baseline="central" font-size="7px">EFFECT · §5.5</text>
  <text class="ef" x="1375.0" y="271.5" text-anchor="middle" dominant-baseline="central" >SETS THE TERMS FOR THE</text>
  <text class="ef" x="1375.0" y="286.5" text-anchor="middle" dominant-baseline="central" >NEXT INTERVENTION</text>
  <rect class="band" x="1265" y="315" width="220" height="44" />
  <text class="ph" x="1375.0" y="330.5" text-anchor="middle" dominant-baseline="central" >AFTERWARDS; SHAPES THE</text>
  <text class="ph" x="1375.0" y="343.5" text-anchor="middle" dominant-baseline="central" >NEXT INTERVENTION</text>

</svg>
