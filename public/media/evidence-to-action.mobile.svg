<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1152" viewBox="0 0 480 1152" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How evidence can become action, and where it can stall</title>
  <desc id="dsc">Six steps from evidence to action: detect, interpret, decide, execute, check, and retarget or exit, grouped into before pacing, activation, and during or ending. Between each step the process can stall: no recognized recipient, no usable basis for a call, no one able or willing to act, no observation or verification, no review or exit rule.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }
    </style>
  </defs>
  <rect width="480" height="1152" fill="#f3f6f9"/>
  <rect width="480" height="1152" fill="url(#grid)"/>
  <rect class="band" x="14" y="20" width="22" height="316" />
  <text class="ph" x="25" y="178.0" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 25 178.0)">BEFORE PACING</text>
  <rect class="band" x="14" y="416" width="22" height="316" />
  <text class="ph" x="25" y="574.0" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 25 574.0)">ACTIVATION</text>
  <rect class="band" x="14" y="812" width="22" height="316" />
  <text class="ph" x="25" y="970.0" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 25 970.0)">DURING / ENDING</text>
  <rect class="box" x="52" y="20" width="400" height="118" />
  <rect class="" x="52" y="104" width="400" height="34" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="20" width="400" height="118" />
  <line class="sep" x1="52" y1="54" x2="452" y2="54"/>
  <text class="hd" x="252.0" y="37" text-anchor="middle" dominant-baseline="central" >DETECT</text>
  <text class="b2" x="252.0" y="71.0" text-anchor="middle" dominant-baseline="central" >Forecasts, evaluations</text>
  <text class="b2" x="252.0" y="89.0" text-anchor="middle" dominant-baseline="central" >or incidents</text>
  <text class="lb" x="252.0" y="114" text-anchor="middle" dominant-baseline="central" font-size="7px">OUTPUT</text>
  <text class="ef" x="252.0" y="128" text-anchor="middle" dominant-baseline="central" >RECOGNIZED SIGNAL</text>
  <line class="arr" x1="110" y1="138" x2="110" y2="206"/>
  <polygon class="head" points="102,204 118,204 110,218"/>
  <circle class="note" cx="110" cy="178.0" r="9"/>
  <path d="M106 174.0 L114 182.0 M114 174.0 L106 182.0" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="119" y1="178.0" x2="150" y2="178.0"/>
  <rect class="note" x="150.0" y="160.0" width="302" height="36" />
  <text class="rd" x="301" y="172.0" text-anchor="middle" dominant-baseline="central" >NO RECOGNIZED</text>
  <text class="rd" x="301" y="184.0" text-anchor="middle" dominant-baseline="central" >RECIPIENT</text>
  <rect class="box" x="52" y="218" width="400" height="118" />
  <rect class="" x="52" y="302" width="400" height="34" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="218" width="400" height="118" />
  <line class="sep" x1="52" y1="252" x2="452" y2="252"/>
  <text class="hd" x="252.0" y="235" text-anchor="middle" dominant-baseline="central" >INTERPRET</text>
  <text class="b2" x="252.0" y="269.0" text-anchor="middle" dominant-baseline="central" >Assess the signal</text>
  <text class="b2" x="252.0" y="287.0" text-anchor="middle" dominant-baseline="central" >against a trigger</text>
  <text class="lb" x="252.0" y="312" text-anchor="middle" dominant-baseline="central" font-size="7px">OUTPUT</text>
  <text class="ef" x="252.0" y="326" text-anchor="middle" dominant-baseline="central" >DECISION BASIS</text>
  <line class="arr" x1="110" y1="336" x2="110" y2="404"/>
  <polygon class="head" points="102,402 118,402 110,416"/>
  <circle class="note" cx="110" cy="376.0" r="9"/>
  <path d="M106 372.0 L114 380.0 M114 372.0 L106 380.0" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="119" y1="376.0" x2="150" y2="376.0"/>
  <rect class="note" x="150.0" y="358.0" width="302" height="36" />
  <text class="rd" x="301" y="370.0" text-anchor="middle" dominant-baseline="central" >NO USABLE BASIS</text>
  <text class="rd" x="301" y="382.0" text-anchor="middle" dominant-baseline="central" >FOR A CALL</text>
  <rect class="box" x="52" y="416" width="400" height="118" />
  <rect class="" x="52" y="500" width="400" height="34" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="416" width="400" height="118" />
  <line class="sep" x1="52" y1="450" x2="452" y2="450"/>
  <text class="hd" x="252.0" y="433" text-anchor="middle" dominant-baseline="central" >DECIDE</text>
  <text class="b2" x="252.0" y="467.0" text-anchor="middle" dominant-baseline="central" >Someone able to affect conduct</text>
  <text class="b2" x="252.0" y="485.0" text-anchor="middle" dominant-baseline="central" >makes a meaningful call</text>
  <text class="lb" x="252.0" y="510" text-anchor="middle" dominant-baseline="central" font-size="7px">OUTPUT</text>
  <text class="ef" x="252.0" y="524" text-anchor="middle" dominant-baseline="central" >ACTIONABLE DECISION</text>
  <line class="arr" x1="110" y1="534" x2="110" y2="602"/>
  <polygon class="head" points="102,600 118,600 110,614"/>
  <circle class="note" cx="110" cy="574.0" r="9"/>
  <path d="M106 570.0 L114 578.0 M114 570.0 L106 578.0" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="119" y1="574.0" x2="150" y2="574.0"/>
  <rect class="note" x="150.0" y="556.0" width="302" height="36" />
  <text class="rd" x="301" y="568.0" text-anchor="middle" dominant-baseline="central" >NO ONE ABLE OR</text>
  <text class="rd" x="301" y="580.0" text-anchor="middle" dominant-baseline="central" >WILLING TO ACT</text>
  <rect class="box" x="52" y="614" width="400" height="118" />
  <rect class="" x="52" y="698" width="400" height="34" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="614" width="400" height="118" />
  <line class="sep" x1="52" y1="648" x2="452" y2="648"/>
  <text class="hd" x="252.0" y="631" text-anchor="middle" dominant-baseline="central" >EXECUTE</text>
  <text class="b2" x="252.0" y="665.0" text-anchor="middle" dominant-baseline="central" >Covered actors</text>
  <text class="b2" x="252.0" y="683.0" text-anchor="middle" dominant-baseline="central" >change conduct</text>
  <text class="lb" x="252.0" y="708" text-anchor="middle" dominant-baseline="central" font-size="7px">OUTPUT</text>
  <text class="ef" x="252.0" y="722" text-anchor="middle" dominant-baseline="central" >OPERATIONAL EFFECT</text>
  <line class="arr" x1="110" y1="732" x2="110" y2="800"/>
  <polygon class="head" points="102,798 118,798 110,812"/>
  <circle class="note" cx="110" cy="772.0" r="9"/>
  <path d="M106 768.0 L114 776.0 M114 768.0 L106 776.0" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="119" y1="772.0" x2="150" y2="772.0"/>
  <rect class="note" x="150.0" y="754.0" width="302" height="36" />
  <text class="rd" x="301" y="766.0" text-anchor="middle" dominant-baseline="central" >NO OBSERVATION</text>
  <text class="rd" x="301" y="778.0" text-anchor="middle" dominant-baseline="central" >OR VERIFICATION</text>
  <rect class="box" x="52" y="812" width="400" height="118" />
  <rect class="" x="52" y="896" width="400" height="34" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="812" width="400" height="118" />
  <line class="sep" x1="52" y1="846" x2="452" y2="846"/>
  <text class="hd" x="252.0" y="829" text-anchor="middle" dominant-baseline="central" >CHECK</text>
  <text class="b2" x="252.0" y="863.0" text-anchor="middle" dominant-baseline="central" >Verify compliance;</text>
  <text class="b2" x="252.0" y="881.0" text-anchor="middle" dominant-baseline="central" >assess new evidence</text>
  <text class="lb" x="252.0" y="906" text-anchor="middle" dominant-baseline="central" font-size="7px">OUTPUT</text>
  <text class="ef" x="252.0" y="920" text-anchor="middle" dominant-baseline="central" >REVIEW FINDING</text>
  <line class="arr" x1="110" y1="930" x2="110" y2="998"/>
  <polygon class="head" points="102,996 118,996 110,1010"/>
  <circle class="note" cx="110" cy="970.0" r="9"/>
  <path d="M106 966.0 L114 974.0 M114 966.0 L106 974.0" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="119" y1="970.0" x2="150" y2="970.0"/>
  <rect class="note" x="150.0" y="952.0" width="302" height="36" />
  <text class="rd" x="301" y="964.0" text-anchor="middle" dominant-baseline="central" >NO REVIEW OR</text>
  <text class="rd" x="301" y="976.0" text-anchor="middle" dominant-baseline="central" >EXIT RULE</text>
  <rect class="box" x="52" y="1010" width="400" height="118" />
  <rect class="" x="52" y="1094" width="400" height="34" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="1010" width="400" height="118" />
  <line class="sep" x1="52" y1="1044" x2="452" y2="1044"/>
  <text class="hd" x="252.0" y="1027" text-anchor="middle" dominant-baseline="central" >RETARGET OR EXIT</text>
  <text class="b2" x="252.0" y="1061.0" text-anchor="middle" dominant-baseline="central" >Continue · retarget</text>
  <text class="b2" x="252.0" y="1079.0" text-anchor="middle" dominant-baseline="central" >Stage resumption · end</text>
  <text class="lb" x="252.0" y="1104" text-anchor="middle" dominant-baseline="central" font-size="7px">OUTPUT</text>
  <text class="ef" x="252.0" y="1118" text-anchor="middle" dominant-baseline="central" >REVISED DIRECTION</text>

</svg>
