  <polygon class="head" points="1098,332.0 1098,348.0 1112,340.0"/>

  <line class="arr" x1="1326" y1="340.0" x2="1365" y2="340.0"/>
  <polygon class="head" points="1364,332.0 1364,348.0 1378,340.0"/>

  <path class="arr" d="M262 550.0 H276.0 Q288.0 550.0 288.0 538.0 V387.0 Q288.0 375.0 300.0 375.0 H301"/>
  <polygon class="head" points="300,367.0 300,383.0 314,375.0"/>

  <path class="arr" d="M612 412 V430 Q612 442 600 442 H463.0 Q451.0 442 451.0 454 V466"/>
  <polygon class="head" points="443.0,466 459.0,466 451.0,480"/>

  <line class="fb" x1="391.0" y1="480" x2="391.0" y2="425"/>
  <polygon class="fbhead" points="383.0,426 399.0,426 391.0,412"/>

  <line class="arr" x1="727.0" y1="412" x2="727.0" y2="465"/>
  <polygon class="head" points="719.0,464 735.0,464 727.0,478"/>

  <path class="arr" d="M421.0 622 V650 Q421.0 662 433.0 662 H1473.0 Q1485.0 662 1485.0 650 V426"/>
  <polygon class="head" points="1477.0,426 1493.0,426 1485.0,412"/>
  <text class="lb" x="953.0" y="682" text-anchor="middle" dominant-baseline="central">BURST AT EXIT OR VIOLATION</text>

  <path class="arr" d="M155.0 268 V142.0 Q155.0 130.0 167.0 130.0 H700.0"/>
  <polygon class="head" points="699.0,122.0 699.0,138.0 713.0,130.0"/>

  <path class="arr" d="M927.0 130.0 H1473.0 Q1485.0 130.0 1485.0 142.0 V255"/>
  <polygon class="head" points="1477.0,254 1493.0,254 1485.0,268"/>
</svg>
