<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="710" viewBox="0 0 1640 710" role="img" aria-labelledby="ttl dsc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttl">Causal graph of a pacing intervention (intermediate)</title>
  <desc id="dsc">A pacing intervention, moderated by coordination and verification, shapes actors' responses, which set the net AI slowdown. Slowdown buys time and resources for complementary activity that mitigates risk, but also delays benefits and builds a capability overhang that raises the incentive to defect and risks a burst of progress at exit or violation. The intervention also drives safety progress directly, bypassing slowdown.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #1e2833; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 17px; fill: #2f3b4b; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #6b7482; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
    </style>
  </defs>

  <rect width="1640" height="710" fill="#f3f6f9"/>
  <rect width="1640" height="710" fill="url(#grid)"/>

  <g>
    <rect class="box" x="715.0" y="60" width="210" height="140"/>
    <line class="sep" x1="715.0" y1="102" x2="925.0" y2="102"/>
    <text class="hd" x="820.0" y="81" text-anchor="middle" dominant-baseline="central">SAFETY PROGRESS</text>
    <text class="bd" x="820.0" y="151.0" text-anchor="middle" dominant-baseline="central">defenses and diffusion</text>
  </g>

  <g>
    <rect class="box" x="50" y="270" width="210" height="140"/>
    <line class="sep" x1="50" y1="312" x2="260" y2="312"/>
    <text class="hd" x="155.0" y="291" text-anchor="middle" dominant-baseline="central">PACING INTERVENTION</text>
    <text class="bd" x="155.0" y="361.0" text-anchor="middle" dominant-baseline="central">caps · monitors · rules</text>
  </g>

  <g>
    <rect class="box" x="316" y="270" width="210" height="140"/>
    <line class="sep" x1="316" y1="312" x2="526" y2="312"/>
    <text class="hd" x="421.0" y="291" text-anchor="middle" dominant-baseline="central">RESPONSE</text>
    <text class="bd" x="421.0" y="361.0" text-anchor="middle" dominant-baseline="central">actors re-optimise</text>
  </g>

  <g>
    <rect class="box" x="582" y="270" width="210" height="140"/>
    <line class="sep" x1="582" y1="312" x2="792" y2="312"/>
    <text class="hd" x="687.0" y="291" text-anchor="middle" dominant-baseline="central">AI SLOWDOWN</text>
    <text class="bd" x="687.0" y="361.0" text-anchor="middle" dominant-baseline="central">net of substitution</text>
  </g>

  <g>
    <rect class="box" x="848" y="270" width="210" height="140"/>
    <line class="sep" x1="848" y1="312" x2="1058" y2="312"/>
    <text class="hd" x="953.0" y="291" text-anchor="middle" dominant-baseline="central">TIME &amp; RESOURCES</text>
    <text class="bd" x="953.0" y="349.0" text-anchor="middle" dominant-baseline="central">time to act</text>
    <text class="bd" x="953.0" y="373.0" text-anchor="middle" dominant-baseline="central">freed compute</text>
  </g>

  <g>
    <rect class="box" x="1114" y="270" width="210" height="140"/>
    <line class="sep" x1="1114" y1="326" x2="1324" y2="326"/>
    <text class="hd" x="1219.0" y="289" text-anchor="middle" dominant-baseline="central">COMPLEMENTARY</text>
    <text class="hd" x="1219.0" y="307" text-anchor="middle" dominant-baseline="central">ACTIVITY</text>
    <text class="bd" x="1219.0" y="356.0" text-anchor="middle" dominant-baseline="central">safety research</text>
    <text class="bd" x="1219.0" y="380.0" text-anchor="middle" dominant-baseline="central">evals · oversight</text>
  </g>

  <g>
    <rect class="box-out" x="1380" y="270" width="210" height="140"/>
    <line class="sep" x1="1380" y1="312" x2="1590" y2="312"/>
    <text class="hd" x="1485.0" y="291" text-anchor="middle" dominant-baseline="central">RISK MITIGATION</text>
    <text class="bd" x="1485.0" y="361.0" text-anchor="middle" dominant-baseline="central">less threat</text>
  </g>

  <g>
    <rect class="box" x="50" y="480" width="210" height="140"/>
    <line class="sep" x1="50" y1="536" x2="260" y2="536"/>
    <text class="hd" x="155.0" y="499" text-anchor="middle" dominant-baseline="central">COORDINATION &amp;</text>
    <text class="hd" x="155.0" y="517" text-anchor="middle" dominant-baseline="central">VERIFICATION</text>
    <text class="bd" x="155.0" y="566.0" text-anchor="middle" dominant-baseline="central">rivals bound</text>
    <text class="bd" x="155.0" y="590.0" text-anchor="middle" dominant-baseline="central">defection visible</text>
  </g>

  <g>
    <rect class="box" x="316" y="480" width="210" height="140"/>
    <line class="sep" x1="316" y1="522" x2="526" y2="522"/>
    <text class="hd" x="421.0" y="501" text-anchor="middle" dominant-baseline="central">CAPABILITY OVERHANG</text>
    <text class="bd" x="421.0" y="559.0" text-anchor="middle" dominant-baseline="central">headroom builds</text>
    <text class="bd" x="421.0" y="583.0" text-anchor="middle" dominant-baseline="central">incentive to defect</text>
  </g>

  <g>
    <rect class="box-out" x="582" y="480" width="210" height="140"/>
    <line class="sep" x1="582" y1="522" x2="792" y2="522"/>
    <text class="hd" x="687.0" y="501" text-anchor="middle" dominant-baseline="central">DELAYED BENEFITS</text>
    <text class="bd" x="687.0" y="571.0" text-anchor="middle" dominant-baseline="central">growth · science</text>
  </g>

