  <text class="hd" x="144.0" y="698.0" text-anchor="middle" dominant-baseline="central" >COMPLEMENTARY ACTIVITY</text>
  <text class="bd" x="144.0" y="737.5" text-anchor="middle" dominant-baseline="central" >safety research</text>
  <text class="bd" x="144.0" y="758.5" text-anchor="middle" dominant-baseline="central" >evals · oversight</text>
