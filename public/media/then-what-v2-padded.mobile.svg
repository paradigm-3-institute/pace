<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1978.0" viewBox="0 0 480 1978.0" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Effects of a pacing intervention, outward through society</title>
  <desc id="dsc">Six stages, outward through society and forward in time: the rule as written; covered developers re-optimizing; relative power shifting as others read the pace; governance machinery that may outlast the rule; investment and markets repricing on expectation; and norms and culture that set the terms for the next intervention.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }

      .hd { font-size: 13.5px; }
      .b2 { font-size: 14.5px; }
      .ef { font-size: 12.5px; }
      .lb, .ph { font-size: 10.5px; }
    </style>
  </defs>
  <rect width="480" height="1978.0" fill="#f3f6f9"/>
  <rect width="480" height="1978.0" fill="url(#grid)"/>
  <rect class="band" x="52" y="20" width="400" height="44" />
<g id="direction" data-bounds="64 32 376 20">
  <text class="ph" x="252.0" y="42.0" text-anchor="middle" dominant-baseline="central" >OUTWARD THROUGH SOCIETY</text>
</g>
  <rect class="box" x="52" y="92" width="400" height="189.5" />
  <rect class="" x="52" y="221.5" width="400" height="60" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="92" width="400" height="189.5" />
  <line class="sep" x1="52" y1="140" x2="452" y2="140"/>
<g id="stage-0-heading" data-bounds="72 104 360 24">
  <text class="hd" x="252.0" y="116.0" text-anchor="middle" dominant-baseline="central" >THE RULE</text>
</g>
<g id="stage-0-body" data-bounds="76 162 352 37.5">
  <text class="b2" x="252.0" y="169.25" text-anchor="middle" dominant-baseline="central" >The pacing rule: scope, trigger, control</text>
  <text class="b2" x="252.0" y="192.25" text-anchor="middle" dominant-baseline="central" >surface and exit.</text>
</g>
<g id="stage-0-reference" data-bounds="68 231.5 368 12">
  <text class="lb" x="252.0" y="237.5" text-anchor="middle" dominant-baseline="central" >CHANGES</text>
</g>
<g id="stage-0-effect" data-bounds="76 253.5 352 14">
  <text class="ef" x="252.0" y="260.5" text-anchor="middle" dominant-baseline="central" >CONSTRAINTS, NOT OBJECTIVES</text>
</g>
  <rect class="band" x="52" y="301.5" width="400" height="38.5" />
<g id="timing-0" data-bounds="66 315.5 372 10.5">
  <text class="ph" x="252.0" y="320.75" text-anchor="middle" dominant-baseline="central" >WHEN IT LANDS</text>
</g>
  <line class="arr" x1="252.0" y1="340.0" x2="252.0" y2="376.0"/>
  <polygon class="head" points="244.0,374.0 260.0,374.0 252.0,388.0"/>
  <rect class="box" x="52" y="388.0" width="400" height="212.5" />
  <rect class="" x="52" y="540.5" width="400" height="60" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="388.0" width="400" height="212.5" />
  <line class="sep" x1="52" y1="436.0" x2="452" y2="436.0"/>
<g id="stage-1-heading" data-bounds="72 400.0 360 24">
  <text class="hd" x="252.0" y="412.0" text-anchor="middle" dominant-baseline="central" >COVERED DEVELOPERS</text>
</g>
<g id="stage-1-body" data-bounds="76 458.0 352 60.5">
  <text class="b2" x="252.0" y="465.25" text-anchor="middle" dominant-baseline="central" >Developers retain their objectives, adapting</text>
  <text class="b2" x="252.0" y="488.25" text-anchor="middle" dominant-baseline="central" >within the rule, working around it, or</text>
  <text class="b2" x="252.0" y="511.25" text-anchor="middle" dominant-baseline="central" >seeking to change it.</text>
</g>
<g id="stage-1-reference" data-bounds="68 550.5 368 12">
  <text class="lb" x="252.0" y="556.5" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.1</text>
</g>
<g id="stage-1-effect" data-bounds="76 572.5 352 14">
  <text class="ef" x="252.0" y="579.5" text-anchor="middle" dominant-baseline="central" >THE RULE IN PRACTICE = RULE + BEST RESPONSE</text>
</g>
  <rect class="band" x="52" y="620.5" width="400" height="38.5" />
<g id="timing-1" data-bounds="66 634.5 372 10.5">
  <text class="ph" x="252.0" y="639.75" text-anchor="middle" dominant-baseline="central" >ON ENACTMENT</text>
</g>
  <line class="arr" x1="252.0" y1="659.0" x2="252.0" y2="695.0"/>
  <polygon class="head" points="244.0,693.0 260.0,693.0 252.0,707.0"/>
  <rect class="box" x="52" y="707.0" width="400" height="231.5" />
  <rect class="" x="52" y="859.5" width="400" height="79" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="707.0" width="400" height="231.5" />
  <line class="sep" x1="52" y1="755.0" x2="452" y2="755.0"/>
<g id="stage-2-heading" data-bounds="72 719.0 360 24">
  <text class="hd" x="252.0" y="731.0" text-anchor="middle" dominant-baseline="central" >RELATIVE POWER</text>
</g>
<g id="stage-2-body" data-bounds="76 777.0 352 60.5">
  <text class="b2" x="252.0" y="784.25" text-anchor="middle" dominant-baseline="central" >Governments, non-covered developers and</text>
  <text class="b2" x="252.0" y="807.25" text-anchor="middle" dominant-baseline="central" >adversaries exploit, absorb or evade pacing's</text>
  <text class="b2" x="252.0" y="830.25" text-anchor="middle" dominant-baseline="central" >opportunities and constraints.</text>
</g>
<g id="stage-2-reference" data-bounds="68 869.5 368 12">
  <text class="lb" x="252.0" y="875.5" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.2</text>
</g>
<g id="stage-2-effect" data-bounds="76 891.5 352 33">
  <text class="ef" x="252.0" y="898.5" text-anchor="middle" dominant-baseline="central" >FRONTIER COMMODITIZES; MORE ACTORS TO</text>
  <text class="ef" x="252.0" y="917.5" text-anchor="middle" dominant-baseline="central" >MONITOR</text>
</g>
  <rect class="band" x="52" y="958.5" width="400" height="38.5" />
<g id="timing-2" data-bounds="66 972.5 372 10.5">
  <text class="ph" x="252.0" y="977.75" text-anchor="middle" dominant-baseline="central" >FROM ENACTMENT ONWARD</text>
</g>
  <line class="arr" x1="252.0" y1="997.0" x2="252.0" y2="1033.0"/>
  <polygon class="head" points="244.0,1031.0 260.0,1031.0 252.0,1045.0"/>
  <rect class="box" x="52" y="1045.0" width="400" height="212.5" />
  <rect class="" x="52" y="1197.5" width="400" height="60" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="1045.0" width="400" height="212.5" />
  <line class="sep" x1="52" y1="1093.0" x2="452" y2="1093.0"/>
<g id="stage-3-heading" data-bounds="72 1057.0 360 24">
  <text class="hd" x="252.0" y="1069.0" text-anchor="middle" dominant-baseline="central" >GOVERNANCE MACHINERY</text>
</g>
<g id="stage-3-body" data-bounds="76 1115.0 352 60.5">
  <text class="b2" x="252.0" y="1122.25" text-anchor="middle" dominant-baseline="central" >Pacing creates governance machinery with</text>
  <text class="b2" x="252.0" y="1145.25" text-anchor="middle" dominant-baseline="central" >powers to inspect and enforce, making it a</text>
  <text class="b2" x="252.0" y="1168.25" text-anchor="middle" dominant-baseline="central" >target for capture and distortion.</text>
</g>
<g id="stage-3-reference" data-bounds="68 1207.5 368 12">
  <text class="lb" x="252.0" y="1213.5" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.3</text>
</g>
<g id="stage-3-effect" data-bounds="76 1229.5 352 14">
  <text class="ef" x="252.0" y="1236.5" text-anchor="middle" dominant-baseline="central" >MAY OUTLAST THE RULE THAT JUSTIFIED IT</text>
</g>
  <rect class="band" x="52" y="1277.5" width="400" height="38.5" />
<g id="timing-3" data-bounds="66 1291.5 372 10.5">
  <text class="ph" x="252.0" y="1296.75" text-anchor="middle" dominant-baseline="central" >AT ACTIVATION; MAY PERSIST PAST EXIT</text>
</g>
  <line class="arr" x1="252.0" y1="1316.0" x2="252.0" y2="1352.0"/>
  <polygon class="head" points="244.0,1350.0 260.0,1350.0 252.0,1364.0"/>
  <rect class="box" x="52" y="1364.0" width="400" height="212.5" />
  <rect class="" x="52" y="1516.5" width="400" height="60" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="1364.0" width="400" height="212.5" />
  <line class="sep" x1="52" y1="1412.0" x2="452" y2="1412.0"/>
<g id="stage-4-heading" data-bounds="72 1376.0 360 24">
  <text class="hd" x="252.0" y="1388.0" text-anchor="middle" dominant-baseline="central" >INVESTMENT &amp; MARKETS</text>
</g>
<g id="stage-4-body" data-bounds="76 1434.0 352 60.5">
  <text class="b2" x="252.0" y="1441.25" text-anchor="middle" dominant-baseline="central" >Valuations reprice before capabilities</text>
  <text class="b2" x="252.0" y="1464.25" text-anchor="middle" dominant-baseline="central" >change; leveraged projects may strand, and</text>
  <text class="b2" x="252.0" y="1487.25" text-anchor="middle" dominant-baseline="central" >restrained actors seek compensation.</text>
</g>
<g id="stage-4-reference" data-bounds="68 1526.5 368 12">
  <text class="lb" x="252.0" y="1532.5" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.4</text>
</g>
<g id="stage-4-effect" data-bounds="76 1548.5 352 14">
  <text class="ef" x="252.0" y="1555.5" text-anchor="middle" dominant-baseline="central" >LIKELY THE MOST IMMEDIATE EFFECT</text>
</g>
  <rect class="band" x="52" y="1596.5" width="400" height="38.5" />
<g id="timing-4" data-bounds="66 1610.5 372 10.5">
  <text class="ph" x="252.0" y="1615.75" text-anchor="middle" dominant-baseline="central" >ON EXPECTATION, BEFORE ANY DIRECT EFFECT</text>
</g>
  <line class="arr" x1="252.0" y1="1635.0" x2="252.0" y2="1671.0"/>
  <polygon class="head" points="244.0,1669.0 260.0,1669.0 252.0,1683.0"/>
  <rect class="box" x="52" y="1683.0" width="400" height="212.5" />
  <rect class="" x="52" y="1835.5" width="400" height="60" fill="#e4ebf2"/>
  <rect class="outline" x="52" y="1683.0" width="400" height="212.5" />
  <line class="sep" x1="52" y1="1731.0" x2="452" y2="1731.0"/>
<g id="stage-5-heading" data-bounds="72 1695.0 360 24">
  <text class="hd" x="252.0" y="1707.0" text-anchor="middle" dominant-baseline="central" >NORMS &amp; CULTURE</text>
</g>
<g id="stage-5-body" data-bounds="76 1753.0 352 60.5">
  <text class="b2" x="252.0" y="1760.25" text-anchor="middle" dominant-baseline="central" >Frontier prestige falls and talent</text>
  <text class="b2" x="252.0" y="1783.25" text-anchor="middle" dominant-baseline="central" >self-selects; credit for prevention is</text>
  <text class="b2" x="252.0" y="1806.25" text-anchor="middle" dominant-baseline="central" >invisible while blame for harm is not.</text>
</g>
<g id="stage-5-reference" data-bounds="68 1845.5 368 12">
  <text class="lb" x="252.0" y="1851.5" text-anchor="middle" dominant-baseline="central" >EFFECT · §5.5</text>
</g>
<g id="stage-5-effect" data-bounds="76 1867.5 352 14">
  <text class="ef" x="252.0" y="1874.5" text-anchor="middle" dominant-baseline="central" >SETS THE TERMS FOR THE NEXT INTERVENTION</text>
</g>
  <rect class="band" x="52" y="1915.5" width="400" height="38.5" />
<g id="timing-5" data-bounds="66 1929.5 372 10.5">
  <text class="ph" x="252.0" y="1934.75" text-anchor="middle" dominant-baseline="central" >AFTERWARD; SHAPES THE NEXT INTERVENTION</text>
</g>
  <line class="arr" x1="30" y1="86" x2="30" y2="1938.0"/>
  <polygon class="head" points="22,1936.0 38,1936.0 30,1950.0"/>

</svg>
