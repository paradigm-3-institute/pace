<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="588.5" viewBox="0 0 1500 588.5" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Failure modes in pacing governance structures</title>
  <desc id="dsc">The rule creates enforcement machinery: a new actor with power and information. Its predictable failure modes are control, capture and misuse (used for purposes beyond the rule that justified it, such as surveillance powers turned on lawful research); behavioral distortions (optimized for the test, not the underlying risk); and persistence and precedent (outlasting the rule that created it, with emergency powers outstaying their welcome, though sometimes with useful spillover into diplomacy and national strategy).</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
      .hd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #1e2833; }
      .hs { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #1e2833; }
      .lb { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #6b7482; }
      .ph { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #4f6a8a; }
      .rd { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .bl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 1px; fill: #3f5f85; }
      .bd { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 16px; fill: #2f3b4b; }
      .b2 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2f3b4b; }
      .b3 { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; fill: #2f3b4b; }
      .bi { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-style: italic; fill: #6b7482; }
      .ef { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 12px; font-weight: 700; fill: #1e2833; }
      .box { fill: #fdfdfe; stroke: #1e2833; stroke-width: 2.5; }
      .box-out { fill: #d6e4f2; stroke: #1e2833; stroke-width: 2.5; }
      .outline { fill: none; stroke: #1e2833; stroke-width: 2.5; }
      .cell { stroke: #1e2833; stroke-width: 1.5; }
      .sep { stroke: #1e2833; stroke-width: 2; }
      .thin { stroke: #c5ccd4; stroke-width: 1; }
      .arr { stroke: #1e2833; stroke-width: 3.5; fill: none; }
      .head { fill: #1e2833; }
      .fb { stroke: #7d8794; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
      .fbhead { fill: #7d8794; }
      .sm { stroke: #8a95a3; stroke-width: 2; fill: none; }
      .smhead { fill: #8a95a3; }
      .band { fill: #eef3f8; stroke: #9fb3c8; stroke-width: 1.2; }
      .note { fill: #fbeae6; stroke: #d0503c; stroke-width: 1.2; }
      .noteb { fill: #eaf0f6; stroke: #4a6b8f; stroke-width: 1.2; }
      .rl { stroke: #d0503c; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .bll { stroke: #4a6b8f; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
      .dn { fill: #f7f9fb; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .red { fill: #fdfdfe; stroke: #c0392b; stroke-width: 2; }
      .redt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #c0392b; }
      .redl { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.5px; fill: #c0392b; }
      .ghost { fill: #eceff2; stroke: #8a95a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .ghostt { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #8a95a3; }
      .cross { stroke: #b5bcc5; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cap { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 11px; letter-spacing: 0.3px; fill: #2f3b4b; }
      .dot-b { fill: #5b7fa6; }
      .dot-g { fill: #a9a9a9; }
      .cons { fill: #dfe7ef; }
      .open { fill: #ebe9e5; }
      .line { stroke: #1e2833; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
      .st { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px; fill: #4f6a8a; }
      .sv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #1e2833; }
      .th { font-family: "IBM Plex Mono", "DejaVu Sans Mono", "Courier New", Courier, monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; fill: #2b3a55; }
      .rh { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 13px; font-weight: 700; fill: #2b3a55; }
      .tv { font-family: Charter, "Source Serif 4", "Source Serif Pro", Georgia, "DejaVu Serif", serif; font-size: 14px; fill: #2b3a55; }
    </style>
  </defs>
  <rect width="1500" height="588.5" fill="#f3f6f9"/>
  <rect width="1500" height="588.5" fill="url(#grid)"/>
  <rect class="band" x="30" y="20" width="330" height="42" />
<g id="created" data-bounds="44 31 302 20">
  <text class="ph" x="195.0" y="41.0" text-anchor="middle" dominant-baseline="central" >CREATED BY THE RULE</text>
</g>
  <rect class="box" x="30" y="84" width="330" height="323" />
  <rect class="" x="30" y="328" width="330" height="79" fill="#e4ebf2"/>
  <rect class="outline" x="30" y="84" width="330" height="323" />
  <line class="sep" x1="30" y1="132" x2="360" y2="132"/>
<g id="machinery-heading" data-bounds="50 96 290 24">
  <text class="hd" x="195.0" y="108.0" text-anchor="middle" dominant-baseline="central" >THE MACHINERY</text>
</g>
<g id="machinery-body" data-bounds="54 154 282 152">
  <text class="b2" x="195.0" y="172.5" text-anchor="middle" dominant-baseline="central" >Enforcement power vested in a</text>
  <text class="b2" x="195.0" y="195.5" text-anchor="middle" dominant-baseline="central" >governing body (§4): some mix of</text>
  <text class="b2" x="195.0" y="218.5" text-anchor="middle" dominant-baseline="central" >access to private information,</text>
  <text class="b2" x="195.0" y="241.5" text-anchor="middle" dominant-baseline="central" >discretionary power to restrict other</text>
  <text class="b2" x="195.0" y="264.5" text-anchor="middle" dominant-baseline="central" >actors, and infrastructure for</text>
  <text class="b2" x="195.0" y="287.5" text-anchor="middle" dominant-baseline="central" >observation or verification.</text>
</g>
<g id="machinery-reference" data-bounds="46 338 298 12">
  <text class="lb" x="195.0" y="344.0" text-anchor="middle" dominant-baseline="central" >EFFECT</text>
</g>
<g id="machinery-effect" data-bounds="54 360 282 33">
  <text class="ef" x="195.0" y="367.0" text-anchor="middle" dominant-baseline="central" >A NEW ACTOR WITH POWER AND</text>
  <text class="ef" x="195.0" y="386.0" text-anchor="middle" dominant-baseline="central" >INFORMATION</text>
</g>
  <rect class="band" x="400" y="20" width="1070" height="42" />
<g id="failure-modes" data-bounds="416 31 1038 20">
  <text class="ph" x="935.0" y="41.0" text-anchor="middle" dominant-baseline="central" >PREDICTABLE FAILURE MODES</text>
</g>
  <path class="arr" d="M360 245.5 H372 Q380 245.5 380 237.5 V49 Q380 41 388 41 H388"/>
  <polygon class="head" points="386,33 386,49 400,41"/>
  <rect class="box" x="400" y="84" width="330" height="323" />
  <rect class="" x="400" y="328" width="330" height="79" fill="#e4ebf2"/>
  <rect class="outline" x="400" y="84" width="330" height="323" />
  <line class="sep" x1="400" y1="132" x2="730" y2="132"/>
<g id="mode-0-heading" data-bounds="420 96 290 24">
  <text class="hd" x="565.0" y="108.0" text-anchor="middle" dominant-baseline="central" >CONTROL, CAPTURE &amp; MISUSE</text>
</g>
<g id="mode-0-body" data-bounds="424 154 282 152">
  <text class="b2" x="565.0" y="161.0" text-anchor="middle" dominant-baseline="central" >Actors pursue their own goals. Access</text>
  <text class="b2" x="565.0" y="184.0" text-anchor="middle" dominant-baseline="central" >to private information and power to</text>
  <text class="b2" x="565.0" y="207.0" text-anchor="middle" dominant-baseline="central" >restrict others invite influence:</text>
  <text class="b2" x="565.0" y="230.0" text-anchor="middle" dominant-baseline="central" >firms lobby for exemptions, agencies</text>
  <text class="b2" x="565.0" y="253.0" text-anchor="middle" dominant-baseline="central" >compete for jurisdiction, and</text>
  <text class="b2" x="565.0" y="276.0" text-anchor="middle" dominant-baseline="central" >governments push shifting political</text>
  <text class="b2" x="565.0" y="299.0" text-anchor="middle" dominant-baseline="central" >priorities.</text>
</g>
<g id="mode-0-reference" data-bounds="416 338 298 12">
  <text class="lb" x="565.0" y="344.0" text-anchor="middle" dominant-baseline="central" >EFFECT</text>
</g>
<g id="mode-0-effect" data-bounds="424 360 282 33">
  <text class="ef" x="565.0" y="367.0" text-anchor="middle" dominant-baseline="central" >USED FOR PURPOSES BEYOND THE RULE</text>
  <text class="ef" x="565.0" y="386.0" text-anchor="middle" dominant-baseline="central" >THAT JUSTIFIED IT</text>
</g>
  <line class="rl" x1="565.0" y1="407" x2="565.0" y2="421"/>
  <circle class="note" cx="565.0" cy="432" r="9"/>
  <path d="M561.0 428 L569.0 436 M569.0 428 L561.0 436" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="565.0" y1="443" x2="565.0" y2="459"/>
  <rect class="note" x="400" y="459" width="330" height="56.5" />
<g id="note-0-0" data-bounds="416 475 298 24.5">
  <text class="rd" x="565.0" y="479.75" text-anchor="middle" dominant-baseline="central" >SURVEILLANCE POWERS TURNED ON LAWFUL</text>
  <text class="rd" x="565.0" y="494.75" text-anchor="middle" dominant-baseline="central" >RESEARCH</text>
</g>
  <rect class="box" x="770" y="84" width="330" height="323" />
  <rect class="" x="770" y="328" width="330" height="79" fill="#e4ebf2"/>
  <rect class="outline" x="770" y="84" width="330" height="323" />
  <line class="sep" x1="770" y1="132" x2="1100" y2="132"/>
<g id="mode-1-heading" data-bounds="790 96 290 24">
  <text class="hd" x="935.0" y="108.0" text-anchor="middle" dominant-baseline="central" >BEHAVIORAL DISTORTIONS</text>
</g>
<g id="mode-1-body" data-bounds="794 154 282 152">
  <text class="b2" x="935.0" y="161.0" text-anchor="middle" dominant-baseline="central" >Surveillance, leaks and</text>
  <text class="b2" x="935.0" y="184.0" text-anchor="middle" dominant-baseline="central" >misinterpretation can deter</text>
  <text class="b2" x="935.0" y="207.0" text-anchor="middle" dominant-baseline="central" >reputationally risky research without</text>
  <text class="b2" x="935.0" y="230.0" text-anchor="middle" dominant-baseline="central" >deliberate abuse. Easily audited or</text>
  <text class="b2" x="935.0" y="253.0" text-anchor="middle" dominant-baseline="central" >publicly salient measures attract</text>
  <text class="b2" x="935.0" y="276.0" text-anchor="middle" dominant-baseline="central" >effort, even when they poorly track</text>
  <text class="b2" x="935.0" y="299.0" text-anchor="middle" dominant-baseline="central" >the underlying risk.</text>
</g>
<g id="mode-1-reference" data-bounds="786 338 298 12">
  <text class="lb" x="935.0" y="344.0" text-anchor="middle" dominant-baseline="central" >EFFECT</text>
</g>
<g id="mode-1-effect" data-bounds="794 360 282 33">
  <text class="ef" x="935.0" y="367.0" text-anchor="middle" dominant-baseline="central" >OPTIMIZED FOR THE TEST, NOT THE</text>
  <text class="ef" x="935.0" y="386.0" text-anchor="middle" dominant-baseline="central" >UNDERLYING RISK</text>
</g>
  <line class="rl" x1="935.0" y1="407" x2="935.0" y2="421"/>
  <circle class="note" cx="935.0" cy="432" r="9"/>
  <path d="M931.0 428 L939.0 436 M939.0 428 L931.0 436" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="935.0" y1="443" x2="935.0" y2="459"/>
  <rect class="note" x="770" y="459" width="330" height="41.5" />
<g id="note-1-0" data-bounds="786 475 298 9.5">
  <text class="rd" x="935.0" y="479.75" text-anchor="middle" dominant-baseline="central" >PASSING TESTS DRIFTS FROM REDUCING RISK</text>
</g>
  <rect class="box" x="1140" y="84" width="330" height="323" />
  <rect class="" x="1140" y="328" width="330" height="79" fill="#e4ebf2"/>
  <rect class="outline" x="1140" y="84" width="330" height="323" />
  <line class="sep" x1="1140" y1="132" x2="1470" y2="132"/>
<g id="mode-2-heading" data-bounds="1160 96 290 24">
  <text class="hd" x="1305.0" y="108.0" text-anchor="middle" dominant-baseline="central" >PERSISTENCE &amp; PRECEDENT</text>
</g>
<g id="mode-2-body" data-bounds="1164 154 282 152">
  <text class="b2" x="1305.0" y="161.0" text-anchor="middle" dominant-baseline="central" >Powers and machinery are not</text>
  <text class="b2" x="1305.0" y="184.0" text-anchor="middle" dominant-baseline="central" >necessarily dismantled at exit (§4.4).</text>
  <text class="b2" x="1305.0" y="207.0" text-anchor="middle" dominant-baseline="central" >Information, once collected, is hard</text>
  <text class="b2" x="1305.0" y="230.0" text-anchor="middle" dominant-baseline="central" >to keep out of other decisions, and a</text>
  <text class="b2" x="1305.0" y="253.0" text-anchor="middle" dominant-baseline="central" >remit widens simply because the body</text>
  <text class="b2" x="1305.0" y="276.0" text-anchor="middle" dominant-baseline="central" >already exists, even when it is poorly</text>
  <text class="b2" x="1305.0" y="299.0" text-anchor="middle" dominant-baseline="central" >suited to new tasks.</text>
</g>
<g id="mode-2-reference" data-bounds="1156 338 298 12">
  <text class="lb" x="1305.0" y="344.0" text-anchor="middle" dominant-baseline="central" >EFFECT</text>
</g>
<g id="mode-2-effect" data-bounds="1164 360 282 33">
  <text class="ef" x="1305.0" y="376.5" text-anchor="middle" dominant-baseline="central" >OUTLASTS THE RULE THAT CREATED IT</text>
</g>
  <line class="rl" x1="1217.5" y1="407" x2="1217.5" y2="421"/>
  <circle class="note" cx="1217.5" cy="432" r="9"/>
  <path d="M1213.5 428 L1221.5 436 M1221.5 428 L1213.5 436" stroke="#d0503c" stroke-width="1.6"/>
  <line class="rl" x1="1217.5" y1="443" x2="1217.5" y2="459"/>
  <rect class="note" x="1140.0" y="459" width="155.0" height="101.5" />
<g id="note-2-0" data-bounds="1156.0 475 123.0 69.5">
  <text class="rd" x="1217.5" y="494.75" text-anchor="middle" dominant-baseline="central" >EMERGENCY POWERS</text>
  <text class="rd" x="1217.5" y="509.75" text-anchor="middle" dominant-baseline="central" >OUTSTAY THEIR</text>
  <text class="rd" x="1217.5" y="524.75" text-anchor="middle" dominant-baseline="central" >WELCOME</text>
</g>
  <line class="bll" x1="1392.5" y1="407" x2="1392.5" y2="421"/>
  <circle class="noteb" cx="1392.5" cy="432" r="9"/>
  <path d="M1392.5 427 V437 M1387.5 432 H1397.5" stroke="#4a6b8f" stroke-width="1.6"/>
  <line class="bll" x1="1392.5" y1="443" x2="1392.5" y2="459"/>
  <rect class="noteb" x="1315.0" y="459" width="155.0" height="101.5" />
<g id="note-2-1" data-bounds="1331.0 475 123.0 69.5">
  <text class="bl" x="1392.5" y="479.75" text-anchor="middle" dominant-baseline="central" >USEFUL SPILLOVER:</text>
  <text class="bl" x="1392.5" y="494.75" text-anchor="middle" dominant-baseline="central" >REUSE IN</text>
  <text class="bl" x="1392.5" y="509.75" text-anchor="middle" dominant-baseline="central" >DIPLOMACY;</text>
  <text class="bl" x="1392.5" y="524.75" text-anchor="middle" dominant-baseline="central" >EXPERTISE INTO</text>
  <text class="bl" x="1392.5" y="539.75" text-anchor="middle" dominant-baseline="central" >NATIONAL STRATEGY</text>
</g>

</svg>
