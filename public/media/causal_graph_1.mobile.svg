  <line class="sep" x1="24" y1="226" x2="274" y2="226"/>
  <text class="hd" x="149.0" y="208.0" text-anchor="middle" dominant-baseline="central" >RESPONSE</text>
  <text class="bd" x="149.0" y="258.0" text-anchor="middle" dominant-baseline="central" >actors re-optimise</text>
  <rect class="box" x="24" y="340" width="250" height="100" />
  <line class="sep" x1="24" y1="376" x2="274" y2="376"/>
  <text class="hd" x="149.0" y="358.0" text-anchor="middle" dominant-baseline="central" >AI SLOWDOWN</text>
  <text class="bd" x="149.0" y="408.0" text-anchor="middle" dominant-baseline="central" >net of substitution</text>
  <rect class="box-out" x="24" y="490" width="250" height="100" />
  <line class="sep" x1="24" y1="526" x2="274" y2="526"/>
  <text class="hd" x="149.0" y="508.0" text-anchor="middle" dominant-baseline="central" >RISK MITIGATION</text>
  <text class="bd" x="149.0" y="558.0" text-anchor="middle" dominant-baseline="central" >less threat</text>
  <rect class="box" x="300" y="150" width="170" height="100" />
  <line class="sep" x1="300" y1="186" x2="470" y2="186"/>
  <text class="hd" x="385.0" y="168.0" text-anchor="middle" dominant-baseline="central" >SAFETY PROGRESS</text>
  <text class="bd" x="385.0" y="207.5" text-anchor="middle" dominant-baseline="central" >defenses and</text>
  <text class="bd" x="385.0" y="228.5" text-anchor="middle" dominant-baseline="central" >diffusion</text>
  <rect class="box-out" x="300" y="340" width="170" height="100" />
  <line class="sep" x1="300" y1="376" x2="470" y2="376"/>
  <text class="hd" x="385.0" y="358.0" text-anchor="middle" dominant-baseline="central" >DELAYED BENEFITS</text>
  <text class="bd" x="385.0" y="408.0" text-anchor="middle" dominant-baseline="central" >growth · science</text>
  <line class="arr" x1="149" y1="140" x2="149" y2="178"/>
  <polygon class="head" points="141,176 157,176 149,190"/>
  <line class="arr" x1="149" y1="290" x2="149" y2="328"/>
  <polygon class="head" points="141,326 157,326 149,340"/>
  <line class="arr" x1="149" y1="440" x2="149" y2="478"/>
