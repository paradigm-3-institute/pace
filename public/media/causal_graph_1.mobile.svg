<svg xmlns="http://www.w3.org/2000/svg" width="510" height="630" viewBox="0 0 510 630" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Causal graph of a pacing intervention</title>
  <desc id="dsc">Pacing intervention causes a response, which causes AI slowdown, which causes risk mitigation. Pacing intervention also causes safety progress, which causes risk mitigation without going through slowdown. AI slowdown also delays benefits.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8ee" stroke-width="1"/>
    </pattern>
    <style>
